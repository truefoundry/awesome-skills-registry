description: 'Getting a first Qdrant Managed Cloud cluster running and connected safely:
  Free, Standard, and Premium tiers, choices that can''t be changed later, creating
  clusters from the Console or the qcloud CLI, Database API keys, ports and TLS, strict
  mode on new collections, Cloud Inference, and what to set before relying on a cluster.
  Use when someone says ''getting started with Qdrant Cloud'', ''create a Qdrant Cloud
  cluster'', ''is the free tier enough'', ''do I need the Premium tier'', ''create
  a cluster with qcloud'', ''my free cluster was suspended'', ''can''t connect to
  Qdrant Cloud'', ''which API key do I use'', ''filter works locally but fails on
  Cloud'', or ''Cloud Inference''.'
