description: "Expanding the candidate pool via relevance feedback, as an alternative\
  \ to reranking when a dense retriever is too weak. Use when someone asks about 'Qdrant's\
  \ Relevance Feedback API', 'improving dense search relevance/recall', 'how to discover/get\
  \ more relevant results from vector search', 'cheaper/better alternative to reranking',\
  \ 'using a more heavy/big embedding model for dense search but can't afford it',\
  \ 'finding more relevant documents beyond the initial search pool', or 'feedback\
  \ loops'. Also trigger when the user has a search quality problem due to a dense\
  \ retriever being weak and is considering reranking as a solution \u2014 this API\
  \ may be a better fit"
