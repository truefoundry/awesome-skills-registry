id: qdrant-skills-qdrant-migration-tool
display_name: qdrant-migration-tool
description: Guides use of the Qdrant Migration Tool CLI to move vectors, metadata,
  and sparse embeddings from another vector database into Qdrant. Use when someone
  asks 'how do I migrate from Pinecone/Weaviate/Milvus/Elasticsearch/OpenSearch/pgvector/s3/Azure/Chroma/Redis/MongoDB/FAISS/Solr
  to Qdrant', 'move my vector database to Qdrant', 'is there a migration tool for
  Qdrant', 'my migration got interrupted, how do I resume it', 'migration is too slow',
  or 'collection wasn't created after migration'. Also use when picking migration
  batch size, deciding on `--net=host`, or verifying data after a migration.
