description: "Expert ISO 27701 Privacy Information Management System (PIMS) compliance\
  \ advisor. Use this skill whenever a user asks about ISO/IEC 27701:2025, ISO/IEC\
  \ 27701:2019, privacy information management, PIMS certification, PII controller\
  \ or processor obligations, privacy risk assessment, Statement of Applicability\
  \ for privacy, privacy by design, data subject rights, DPIA, records of processing\
  \ activities, transitioning from ISO 27701:2019, GDPR alignment with ISO 27701,\
  \ or any privacy management system topic. Also trigger for questions about Annex\
  \ A.1 (controller controls), A.2 (processor controls), A.3 (shared security controls),\
  \ or implementing a standalone PIMS without ISO 27001. When in doubt, use this skill\
  \ \u2014 it covers the full ISO 27701 lifecycle from gap assessment through certification."
