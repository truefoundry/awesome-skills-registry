id: lawvable-awesome-legal-skills-jev-question-translator-seth-chandler
display_name: jev-question-translator
description: 'Turns a legal question, a set of draft questions, or source material
  such as a statute, jury instruction, rubric, contract checklist, or coding manual
  into a battery of narrow questions that TypeSafe''s Jev, a fast classifier that
  returns probabilities rather than prose, can answer reliably across many documents.
  The skill breaks conclusions such as negligence, felony murder, or standing into
  element-level questions, writes the governing rule into each question, and delivers
  the questions alone, in Jev''s request format or in plain English. Built for legal
  work that asks the same questions of many texts: coding statutes across jurisdictions,
  coding opinions or case files for empirical research, checking contracts against
  a review checklist, screening intake narratives, and grading student work against
  a rubric. Use when asked to write Jev questions, build a classifier for legal documents,
  or turn a legal test into yes-or-no questions. Running the questions requires Jev
  access; writing them does not.'
