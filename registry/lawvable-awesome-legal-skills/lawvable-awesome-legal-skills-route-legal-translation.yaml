id: lawvable-awesome-legal-skills-route-legal-translation
display_name: route-legal-translation
description: "Pick the right LLM for LEGAL TRANSLATION \u2014 translating contracts,\
  \ statutes, case law, and legal correspondence across languages, including Arabic/MENA.\
  \ Vendor-neutral routing triangulated from mid-2026 evidence (WMT25 human eval,\
  \ SwiLTra-Bench legal-MT, multilingual-reasoning proxies, ArabLegalEval). There\
  \ is NO clean legal-translation leaderboard, so this vertical is directional and\
  \ treats human legal-linguist review as mandatory. Asks up to 4 quick questions\
  \ (language pair, cost, speed, privacy/certification), then recommends a primary\
  \ model + fallback + what to avoid + what a human must verify. Use when someone\
  \ asks \"which model to translate this contract/statute\", \"best AI for legal translation\"\
  , \"translate this legal doc to/from Arabic\", or is about to machine-translate\
  \ legal text without a fixed model."
