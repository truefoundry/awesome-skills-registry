description: Depth assessment of whether an AI system is high-risk under Art. 6 of
  the EU AI Act, grounded in the Commission's draft Art. 6(5) classification guidelines
  (general principles + Annex I + Annex III). Covers the Annex I product-safety route,
  all eight Annex III areas with worked examples, the Art. 6(3) exception and its
  profiling re-exception, and the Art. 25 quasi-provider trap. Outputs a structured
  decision block, a practitioner memo, and a JSON interchange artefact.
