description: "Generate a spreadsheet of test entries \u2014 newly designated names\
  \ from OFAC, OFSI, and EU sanctions lists plus deliberate variations of those names\
  \ \u2014 to validate that a sanctions screening system catches fresh designations\
  \ and is tuned to the right fuzziness threshold. Use this whenever the user asks\
  \ for sanctions list update test data, screening regression test data, screening\
  \ QA, fuzzy match calibration, or wants to verify their screening lists are current.\
  \ Trigger even if the user doesn't say 'screening' explicitly \u2014 phrases like\
  \ 'test my sanctions list', 'check our SDN coverage', 'is my list up to date', or\
  \ 'build me a regression set from the latest designations' should also invoke this\
  \ skill."
