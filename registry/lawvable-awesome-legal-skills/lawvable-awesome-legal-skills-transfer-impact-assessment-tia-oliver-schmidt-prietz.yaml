description: GDPR Transfer Impact Assessment for Chapter V transfers under the EDPB
  Recommendations 01/2020 six-step methodology, the CNIL TIA Guide (January 2025),
  and EDPB essential guarantees. Handles transfer qualification, Art. 45 adequacy
  fast-tracks, Art. 46 full assessments with country profiles for 12 jurisdictions,
  and balanced Art. 49 derogation analysis. Outputs a Markdown report, a .docx formal
  TIA, and a JSON delta for RoPA interchange.
