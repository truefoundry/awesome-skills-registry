  \ Type 1 or Type 2, audit readiness, compliance gaps, control documentation, evidence\
  \ collection, vendor risk questionnaires, or anything related to AICPA service organization\
  \ controls. Trigger even for adjacent topics like \"we need to get audited\", \"\
  a customer asked for our security report\", \"writing an information security policy\"\
  , or \"preparing for an audit\". Covers gap analysis, policy writing, control documentation,\
  \ audit evidence preparation, and vendor risk reviews for organizations at any maturity\
  \ level \u2014 from first-time startups to seasoned compliance teams."
