description: NIL (Name, Image, and Likeness) contract analysis for NCAA student-athletes
  from the athlete's perspective. Use when user says 'review this NIL contract', 'analyze
  this NIL deal', 'check this athlete agreement', 'review my NIL agreement', or uploads
  a PDF NIL contract for review. Identifies red flags, missing protections, and compliance
  issues. Produces a structured review memorandum with negotiation positions. Do NOT
  use for general contract review, employment agreements, non-NIL endorsements, or
  brand-side deal analysis.
