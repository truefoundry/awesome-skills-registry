id: lawvable-awesome-legal-skills-ambiguity-report-seth-chandler
display_name: ambiguity-report
description: "Turn an interpretive-ambiguity audit of a legal text \u2014 contract,\
  \ statute, regulation, or judicial opinion \u2014 into a polished deliverable. Produces\
  \ a multi-page website (default), a single-page interactive site, a Microsoft Word\
  \ document, a PowerPoint deck, or a LaTeX/PDF. Use whenever a user has a stress-test\
  \ result, ambiguity audit, or \"where will this be litigated\" scenarios and wants\
  \ to publish, present, or share them. Triggers on \"publish the audit,\" \"make\
  \ a report from this,\" \"turn this into a website / deck / brief / Word doc,\"\
  \ \"make a Netlify site,\" \"build slides of these ambiguities,\" \"render the scenarios,\"\
  \ \"package this stress test,\" \"produce a LaTeX version,\" and similar. Pairs\
  \ with the ambiguity-stress-test skill (the underlying analysis) but works on any\
  \ structured or semi-structured ambiguity analysis. Visual design is opinionated\
  \ but the user can override colors, fonts, and brand label. Most formats need Python\
  \ and a writable filesystem; single-file HTML works where the host has neither."
