id: lawvable-awesome-legal-skills-client-explanation-translator-larissa-meredith-flister
display_name: client-explanation-translator-larissa-meredith-flister
description: "Turn complex legal analysis into clear, commercially useful client-facing\
  \ advice. Use this whenever the user has dense legal material \u2014 drafting, internal\
  \ analysis, counsel notes, research memos, pleadings, a case update, or correspondence\
  \ \u2014 and wants it converted into something a client can actually understand\
  \ and act on. Trigger on phrases like 'explain this to the client', 'put this in\
  \ plain English', 'translate this for a non-lawyer', 'turn this into client-facing\
  \ advice', 'make this client-ready', 'draft a client update', or when the user shares\
  \ legal analysis and asks 'what does this mean for them'. Also trigger when the\
  \ user wants a board summary, litigation risk update, or call script derived from\
  \ legal material. The skill preserves legal nuance, uncertainty, and risk rather\
  \ than oversimplifying \u2014 it makes advice usable, not just simpler."
