  \ recommends a primary model + fallback + what to avoid + what a human must verify.\
  \ Use when someone asks \"which model for legal research / case analysis / a memo\"\
  , \"best AI for legal reasoning\", \"route this research task\", or is starting\
  \ legal analysis without a fixed model."
