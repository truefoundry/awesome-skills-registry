description: Organize document evidence into auditable competing hypotheses, source-linked
  observations, an assessment matrix and document-linked discriminating tests. Use
  for bounded explanatory questions, documents that could resolve uncertainty, rejection
  history, source provenance, gaps and updates, including a withdrawn or corrected
  fact and which explanations and earlier judgments it puts back under review; not
  findings of guilt or predictions about people. Evaluation preview requiring human
  review.
