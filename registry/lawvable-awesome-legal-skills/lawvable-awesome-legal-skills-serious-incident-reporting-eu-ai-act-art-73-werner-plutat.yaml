display_name: serious-incident-reporting
description: Assess, report, and manage serious incidents involving high-risk AI systems
  under Article 73 EU AI Act. Covers incident qualification, deadline buckets (2/10/15
  days), authority notification, deployer duties (Art. 26(5)), cross-regulation mapping
  (GDPR/NIS2/MDR), corrective measures, and DACH-specific routing. Use when asked
  to evaluate whether an AI incident is reportable, draft an Article 73 notification,
  identify the right authority, or build an AI incident response process.
