id: lawvable-awesome-legal-skills-fundamental-rights-impact-assessment-eu-ai-act-art-27-werner-plutat
display_name: eu-ai-act-fria
description: Assess whether a Fundamental Rights Impact Assessment (FRIA) is required
  under Article 27 EU AI Act, and structure or draft that assessment for a specific
  high-risk AI deployment. Covers deployer scope gating (public bodies and private
  entities providing public services), affected group mapping, Charter rights analysis,
  proportionality, safeguards evaluation, residual risk, DPIA/FRIA cross-referencing
  under the amended Article 27(4), the unconditional notification duty under Article
  27(3), and DACH-specific considerations. Use when asked about FRIA obligations,
  Article 27 scope, fundamental rights and AI, or deployer assessment duties.
