id: lawvable-awesome-legal-skills-footnote-relegator-seth-chandler
display_name: footnote-relegator
description: Condense a scholarly legal article by moving nonessential detail from
  the body into substantive footnotes while preserving every word and keeping the
  argument self-sufficient. Handles Markdown and Word (.docx), integrates moved material
  with existing notes, measures a user-specified relegation fraction (25% by default),
  and delivers a move-by-move memo. Use when asked to "push detail into footnotes,"
  "relegate to footnotes," "footnote the caveats," "move the digressions down," or
  tighten a dense draft without deleting content. Word output requires file access
  plus document-conversion and rendering support; when those capabilities are unavailable,
  deliver Markdown and the memo or ask for a convertible source.
