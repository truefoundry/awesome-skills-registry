id: lawvable-awesome-legal-skills-lawve-prep-seth-chandler
display_name: lawve-prep
description: "Takes a skill \u2014 a .skill or .zip archive, a bare SKILL.md, a folder,\
  \ or just a raw idea \u2014 and produces a package ready for public distribution\
  \ on lawve.ai, plus the exact entries for the submission form. Runs a gate first:\
  \ skills with no plausible legal use, unsafe code, or licensing bars are declined\
  \ with reasons, and general-purpose skills that could serve legal work are offered\
  \ a legal adaptation instead. Then applies the standard compliance transforms \u2014\
  \ structure, metadata, attribution, dependency ladders, orphaned-file repair, limitations\
  \ disclosure \u2014 validates the result, and delivers a zip. Raw ideas are gated\
  \ first, built (via skill-creator where available), then adapted. Use for \"make\
  \ this Lawve-compliant,\" \"prep this skill for Lawve,\" \"package for lawve.ai,\"\
  \ \"is this suitable for Lawve,\" \"get my skill ready to publish,\" or any request\
  \ to ready a skill for the Lawve catalogue."
