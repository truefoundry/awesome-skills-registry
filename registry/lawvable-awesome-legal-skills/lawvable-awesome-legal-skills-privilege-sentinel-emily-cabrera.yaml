id: lawvable-awesome-legal-skills-privilege-sentinel-emily-cabrera
display_name: privilege-sentinel
description: Pre-flight privilege and work-product check for legal AI prompts. Use
  when the user is about to send legal content to a third-party AI surface (ChatGPT,
  Claude.ai, Copilot, Gemini, etc.) and wants to know whether the prompt risks blowing
  attorney-client privilege or work-product protection. Returns a SAFE/CAUTION/STOP
  band with cited factors, a discovery-impact line, and a redacted-safe rewrite.
