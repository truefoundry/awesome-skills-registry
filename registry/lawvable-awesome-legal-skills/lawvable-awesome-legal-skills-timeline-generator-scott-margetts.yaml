  \ when delays occur \u2014 showing programme impact and drafting communications.\
  \ Produces filtered workstream or jurisdiction views for local counsel. Trigger\
  \ on: 'build a timeline', 'Gantt chart', 'critical path', 'what if X is delayed',\
  \ 'what moves if', 'schedule impact', 'how does this affect the programme', 'when\
  \ do we finish', 'can we still close on time', 'if we miss this deadline', 'run\
  \ a what-if', 'visualise the plan', 'Germany timeline', 'what does the Employment\
  \ workstream look like', 'timeline for local counsel', 'just show me the [workstream]\
  \ tasks'."
