id: lawvable-awesome-legal-skills-nis2-tanaji-hemant-naik
display_name: nis2
description: 'EU NIS2 Directive (Directive (EU) 2022/2555) compliance advisor for
  essential and important entities: entity classification, Art. 21 risk management
  measures, Art. 23 incident reporting timelines (24h/72h/1 month), Art. 20 governance
  obligations, supply chain security (Art. 21(2)(d); coordinated risk assessments
  Art. 22), gap assessments, policy drafting, ISO 27001 alignment, and penalty exposure
  analysis. Also covers Commission Implementing Regulation (EU) 2024/2690, the technical/methodological
  sub-requirements for Art. 21(2) and the significant-incident thresholds binding
  on DNS/cloud/data-centre/MSP/MSSP/trust-service and other digital entities. Use
  for NIS2 readiness, transposition questions, ENISA technical implementation guidance,
  significant-incident thresholds, supervisory differences between essential and important
  entities, and cross-border coordination.'
