id: lawvable-awesome-legal-skills-citable-cameron-russell
display_name: citable
description: Citable builds an interactive cite-checking table for US court filings
  (briefs, memoranda, petitions, declarations, etc.). Every citation links to its
  pinpoint location in the record exhibit, the case (CourtListener), the statute (Cornell
  LII) or the treaty (flagged where one cannot be located), with a status and a note
  field per citation for the reviewer to fill. When the filing is revised, citable
  rebuilds the table, flags citation-related changes and carries the saved review
  forward. Use when the user asks to cite-check, build a citation table, link a brief's
  citations, or update a table for a revised draft.
