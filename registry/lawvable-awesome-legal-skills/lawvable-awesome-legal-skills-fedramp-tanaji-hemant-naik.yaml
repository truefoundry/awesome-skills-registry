description: "Expert guidance for FedRAMP certification and compliance under CR26\
  \ (FedRAMP Consolidated Rules for 2026). Use this skill whenever a user asks about\
  \ FedRAMP authorization, ATO (Authority to Operate), cloud security for federal\
  \ government, NIST SP 800-53 controls, CSP compliance, or any of the core FedRAMP\
  \ document types: SSP, SAP, SAR, POA&M, CIS/CRM workbooks. Also trigger for questions\
  \ about FedRAMP Certification Classes (A, B, C, D \u2014 new baseline labels: A\
  \ = pilot/transitional, B = LI-SaaS/Low, C = Moderate, D = High, per NTC-0004),\
  \ FedRAMP 20x (now the primary authorization pathway), OSCAL mandate (September\
  \ 2026), 3PAO assessments, continuous monitoring (ConMon), gap assessments, system\
  \ boundary definition, or architecture reviews for federal cloud. FedRAMP Ready\
  \ retires July 28, 2026. When in doubt, use this skill \u2014 it covers the full\
  \ FedRAMP lifecycle from readiness through continuous monitoring."
