display_name: employment-law-research
description: Research a US employment law topic across federal, state, and city jurisdictions
  and produce structured research notes with proper source attribution. Use this skill
  any time the user asks about US employment laws, regulations, or pending legislation
  - from a single jurisdiction question to a 50-state survey. Triggers include phrases
  like "research [employment law topic]", "what are the laws on [employment topic]",
  "state-by-state [employment topic]", "help me understand [topic] across the US",
  or any prompt that asks for a legal landscape overview before another deliverable.
  Always run this BEFORE the employment-law-dashboard skill if a dashboard is the
  eventual output. Output is a structured research note that distinguishes primary
  sources (statutes, regs, agency guidance) from secondary sources (law firm alerts,
  tracker orgs).
