  risk tier", "check if something is an AI system", "assess prohibited practices",
  "check high-risk classification", "determine Art. 6 exception applicability", or
  mentions "KI-Verordnung", "Risikoklassifizierung", Art. 5, Annex III, or GPAI systemic
  risk.
