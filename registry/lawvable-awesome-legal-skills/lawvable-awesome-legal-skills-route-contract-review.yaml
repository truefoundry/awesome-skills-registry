description: "Pick the right LLM for CONTRACT REVIEW \u2014 reviewing an existing\
  \ agreement for risk, deviations from standard, missing protections, and internal\
  \ contradictions, and proposing redlines. Vendor-neutral routing grounded in mid-2026\
  \ legal benchmarks. Contract review is a COMPOSITE skill (extraction + reasoning\
  \ + redlining + conflict-detection), so this routes by the dominant sub-task. Asks\
  \ up to 4 quick questions (cost, speed, accuracy/stakes, privacy/jurisdiction/ language),\
  \ then recommends a primary model + fallback + what to avoid + what a human must\
  \ verify. Use when someone asks \"which model to review this contract / NDA / MSA\"\
  , \"best AI to redline\", \"route this contract review\", or is about to review\
  \ an agreement without a fixed model."
