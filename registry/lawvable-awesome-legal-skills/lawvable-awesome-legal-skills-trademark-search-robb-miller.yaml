display_name: trademark-search-robb-miller
description: "Run an attorney-facing knockout/availability trademark search across\
  \ the United States and Canada. Use whenever a user (founder, client, or attorney)\
  \ asks whether a brand, mark, name, logo, slogan, or product name is \"available,\"\
  \ \"free to use,\" \"clearable,\" or \"already taken\" \u2014 or asks Claude to\
  \ \"search the trademark register,\" \"check USPTO,\" \"check CIPO,\" \"do a knockout\
  \ search,\" \"clearance search,\" \"availability search,\" or \"see if [mark] is\
  \ trademarked.\" Trigger even when the user phrases it casually (\"can I call my\
  \ company X?\", \"is this name taken?\"). Covers federal USPTO (TESS/TSDR), federal\
  \ Canada (CIPO), common-law/web/state, and WIPO Madrid international. Output is\
  \ a knockout availability memo with green/yellow/red verdict for attorney review.\
  \ Includes professional-responsibility gating (AI-use disclosure, conflict check,\
  \ scope confirmation) before substantive analysis. Not legal advice \u2014 produces\
  \ work product for attorney sign-off."
