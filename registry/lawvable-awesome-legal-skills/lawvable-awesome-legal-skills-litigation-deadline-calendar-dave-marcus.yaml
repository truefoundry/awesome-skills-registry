description: 'Calendar litigation and arbitration deadlines from a scheduling order.
  Parses a PDF scheduling order, identifies key dates, computes backward deadlines
  using the applicable rules (Colorado CRCP, Federal FRCP, or arbitration forum rules
  for AAA/JAMS), and generates an .ics calendar file for Outlook or Google Calendar
  import. Use this skill whenever the user mentions: litigation deadlines, scheduling
  order, case management order, deadline calendaring, discovery deadlines, trial preparation
  deadlines, arbitration scheduling, or anything related to computing or tracking
  court or arbitration deadlines. Also trigger when the user uploads a PDF that appears
  to be a court scheduling order or arbitration scheduling order.'
