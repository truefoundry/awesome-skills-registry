display_name: screening-alert-adjudication-amir-fadavi
description: "Adjudicates whether a hit generated by sanctions, PEP, or adverse-media\
  \ screening is a true positive, false positive, or requires human escalation. Use\
  \ whenever a user presents a screening alert, a name match against a watchlist (OFAC\
  \ SDN, EU consolidated list, UK OFSI, UN list, PEP list, adverse media hit, etc.),\
  \ or asks to clear a screening hit / reduce false positives / determine whether\
  \ a flagged name is actually the listed party. Use even when the user describes\
  \ the task casually \u2014 \"is this person actually on the sanctions list\", \"\
  did we get a real match\", \"clear this alert\", \"I have a hit on X\" \u2014 these\
  \ are all screening-adjudication tasks. Produces a deterministic determination with\
  \ full audit trail (structured JSON + human-readable narrative). Designed for use\
  \ by compliance analysts and screening systems."
