display_name: client-instruction-schedule
description: "Build a client instruction schedule \u2014 a plain-English, Scott Schedule-style\
  \ Word table that gathers a struggling client's evidence and instructions issue\
  \ by issue, with a one-page covering note. Use whenever the user asks for a \"client\
  \ instruction schedule\", \"instruction schedule\", \"client questionnaire\", \"\
  schedule of questions for the client\", \"get instructions from the client on the\
  \ papers\", or says the client is overwhelmed and needs the case broken into manageable\
  \ questions. Also trigger when asked to turn case papers into a structured request\
  \ for client input. Do NOT use for court-facing Scott Schedules, pleadings, witness\
  \ statements, or advice letters \u2014 this skill produces a client-facing working\
  \ document only. Output is always a .docx draft for solicitor review, never a final\
  \ document."
