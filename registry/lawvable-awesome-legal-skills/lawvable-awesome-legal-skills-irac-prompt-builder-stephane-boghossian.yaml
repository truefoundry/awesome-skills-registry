display_name: irac-prompt-stephane-boghossian
description: "Restructure any rough build, research, or legal-drafting request into\
  \ an IRAC-shaped prompt \u2014 Issue, Rule, Analysis, Conclusion \u2014 optimized\
  \ for a frontier model. It's the bar-exam framework, repurposed as prompt engineering.\
  \ The skill leads with the issue and ends with the conclusion (where models weight\
  \ attention most), forces you to name your constraints and non-goals, and specifies\
  \ what \"good\" looks like before a single token is generated. Use it before any\
  \ non-trivial build, or whenever a vague ask deserves a precise brief."
