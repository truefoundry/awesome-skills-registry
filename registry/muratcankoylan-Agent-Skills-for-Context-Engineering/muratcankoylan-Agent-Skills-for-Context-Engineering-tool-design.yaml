id: muratcankoylan-Agent-Skills-for-Context-Engineering-tool-design
display_name: tool-design
description: 'This skill should be used for the tool-interface layer of an agent system
  specifically: writing tool descriptions agents can route on, designing tool schemas
  and response formats, naming conventions, actionable error recovery messages, MCP
  server design, tool-set consolidation, and deciding when to add or remove an individual
  tool. Use this when the unit of work is a single tool or a set of tools. Route project-shape,
  pipeline architecture, and task-model-fit decisions to project-development; route
  deciding whether to introduce sub-agents to multi-agent-patterns.'
