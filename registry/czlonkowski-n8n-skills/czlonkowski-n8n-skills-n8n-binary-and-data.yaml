id: czlonkowski-n8n-skills-n8n-binary-and-data
display_name: n8n-binary-and-data
description: "Handle files and binary data in n8n correctly. Use when working with\
  \ files, images, PDFs, attachments, uploads or downloads, base64, vision/multimodal\
  \ input, or when an AI agent needs a file as tool input or output \u2014 and whenever\
  \ the user mentions $binary, binaryPropertyName, \"read the PDF\", \"attach the\
  \ file\", \"send the image\", Merge losing binary, or a CDN for chat images. Covers\
  \ the $binary vs $json split, reading/writing binary, keeping binary alive across\
  \ transforms with Merge, the agent-tool binary boundary, and the CDN/URL requirement\
  \ for chat surfaces."
