description: "Use when building, editing, validating, testing, or debugging an n8n\
  \ workflow through the n8n-mcp MCP server \u2014 designing a flow, configuring a\
  \ node, writing an expression or Code node, wiring credentials, or fixing one that\
  \ misbehaves. The entry-point skill for the n8n-mcp-skills pack: it routes you to\
  \ the right specialist skill, gives working knowledge of every n8n-mcp tool from\
  \ turn one, and states the rules that keep workflows from breaking in production.\
  \ Always consult it first on any n8n, workflow, node, or automation task \u2014\
  \ even a quick one-off, and even when the user names no skill \u2014 because n8n's\
  \ surface drifts between versions and the specialist skills prevent silent failures."
