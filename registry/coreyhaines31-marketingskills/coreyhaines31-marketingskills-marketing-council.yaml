display_name: marketing-council
description: "When the user wants multiple expert perspectives on a marketing question\
  \ \u2014 a simulated board of advisors staffed by legendary marketers (Seth Godin,\
  \ David Ogilvy, Eugene Schwartz, April Dunford, Rory Sutherland, Alex Hormozi, Byron\
  \ Sharp, and more). Also use when the user mentions 'marketing council,' 'board\
  \ of advisors,' 'advisory board,' 'what would Seth Godin say,' 'what would Ogilvy\
  \ think,' 'channel Hormozi,' 'get multiple perspectives,' 'debate this,' 'have the\
  \ council review,' 'marketing mentors,' or asks how a famous marketer would approach\
  \ their problem. The council gives each advisor's take through their documented\
  \ frameworks, surfaces where they disagree, and synthesizes a recommendation. For\
  \ executing the winning direction, hand off to positioning, offers, copywriting,\
  \ ads, or the relevant skill."
