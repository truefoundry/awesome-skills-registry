description: "When the user wants to set up a recurring, self-running marketing workflow\
  \ \u2014 a repeatable loop an AI agent runs on a cadence (weekly, daily, on a trigger)\
  \ rather than a one-off task. Also use when the user mentions 'marketing loop,'\
  \ 'recurring marketing workflow,' 'automate my marketing,' 'marketing on autopilot,'\
  \ 'weekly marketing review,' 'ad fatigue check,' 'weekly ads check,' 'content refresh\
  \ loop,' 'churn watch,' 'ranking drop alert,' 'run my SEO,' 'SEO operator,' 'daily\
  \ SEO agent,' 'run my outbound,' 'AI SDR,' 'reply triage,' 'always-on marketing,'\
  \ 'marketing automation workflow,' or 'run this every week.' Use this to pick, adapt,\
  \ and schedule an ongoing marketing loop that orchestrates the other marketing skills.\
  \ For one-off marketing ideas, see marketing-ideas. For the experimentation loop\
  \ specifically, see ab-testing."
