  'get featured,' 'media list,' 'media kit,' 'press kit,' 'newsjacking,' 'news hijack,'
  'HARO,' 'Qwoted,' 'Featured,' 'reporter request,' 'tech press,' 'TechCrunch,' 'thought
  leadership placement,' 'op-ed,' 'guest article,' 'press contacts,' 'podcast prep,'
  'podcast guest,' 'prep me for this podcast,' 'how do I get press,' 'PR crisis,'
  'crisis communications,' 'respond to backlash,' 'we got hacked,' 'data breach statement,'
  or 'holding statement.' Also covers crisis response when something goes wrong. For
  startup/SaaS/AI directory submissions, see directory-submissions. For product launches,
  see launch. For social-media engagement, see social. For cold-email outreach to
  prospects, see cold-email.
