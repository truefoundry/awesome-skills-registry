id: coreyhaines31-marketingskills-reverse-engineer-marketing
display_name: reverse-engineer-marketing
description: When the user wants to reverse engineer how another company grew and
  copy what worked. Also use when the user mentions 'reverse engineer,' 'how did X
  grow,' 'how does X get customers,' 'growth teardown,' 'marketing teardown,' 'GTM
  teardown,' 'growth blueprint,' 'what is X doing for marketing,' 'what made X take
  off,' 'copy X's playbook,' 'X's distribution strategy,' 'what content works for
  X,' 'funnel hack,' 'map their funnel,' or 'watch what X is doing.' Builds a dated
  log of a company's moves against its traffic curve from public data, sign-ups and
  demos, team interviews, and hidden signals (DNS, certificate logs, archives, sponsorships),
  compares it with the user's own data, and turns what lined up with growth into plays
  routed to the skill that runs each one. For a snapshot profile of a competitor's
  positioning, pricing, and features, see competitor-profiling. For comparison pages,
  see competitors. For why a single post went viral, see social.
