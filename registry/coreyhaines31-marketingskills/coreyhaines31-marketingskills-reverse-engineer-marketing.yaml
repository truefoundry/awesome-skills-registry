id: coreyhaines31-marketingskills-reverse-engineer-marketing
display_name: reverse-engineer-marketing
description: When the user wants to reverse engineer how another company grew and
  copy what worked. Also use when the user mentions 'reverse engineer,' 'how did X
  grow,' 'how does X get customers,' 'growth teardown,' 'marketing teardown,' 'GTM
  teardown,' 'what is X doing for marketing,' 'what made X take off,' 'copy X's playbook,'
  'funnel hack,' 'map their funnel,' 'what is everyone in my category doing,' 'where
  are competitors weak,' 'what is X hiring for,' or 'watch what X is doing.' Builds
  a dated log of a company's moves against its traffic curve from public data, sign-ups
  and demos, team interviews, job posts, reviews, and hidden signals (DNS, certificate
  logs, archives), compares it with the user's own data and with other competitors,
  finds where they're weak, and turns it all into plays routed to the skill that runs
  each one. For a snapshot profile of a competitor's positioning, pricing, and features,
  see competitor-profiling. For comparison pages, see competitors. For why a single
  post went viral, see social.
