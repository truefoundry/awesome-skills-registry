description: "When the user wants to plan, run, sponsor, speak at, or get pipeline\
  \ from events \u2014 webinars, conferences, trade shows, meetups, dinners, workshops,\
  \ virtual summits, or user conferences. Also use when the user mentions 'event marketing,'\
  \ 'field marketing,' 'run a webinar,' 'webinar funnel,' 'show-up rate,' 'should\
  \ we sponsor,' 'sponsor a conference,' 'trade show booth,' 'booth strategy,' 'event\
  \ ROI,' 'badge scans,' 'event follow-up,' 'speaking slot,' 'CFP,' 'conference talk,'\
  \ 'host a dinner,' 'user conference,' or 'virtual summit.' Covers all four roles:\
  \ hosting, sponsoring/exhibiting, speaking, and attending. For product launch moments,\
  \ see launch. For the partnership side of joint webinars, see co-marketing. For\
  \ ongoing community programs, see community-marketing. For podcast appearances,\
  \ see public-relations. For the email sequences themselves, see emails."
