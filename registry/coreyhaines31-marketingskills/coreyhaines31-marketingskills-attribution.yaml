display_name: attribution
description: "When the user wants to figure out which marketing actually drives conversions\
  \ and revenue, choose or interpret an attribution model, or reconcile conflicting\
  \ numbers across tools. Also use when the user mentions \"attribution,\" \"attribution\
  \ model,\" \"first-touch vs last-touch,\" \"multi-touch,\" \"which channel drives\
  \ revenue,\" \"what's my real CAC,\" \"my dashboards disagree,\" \"Google/Meta says\
  \ X but GA says Y,\" \"media mix model,\" \"MMM,\" \"incrementality,\" \"geo lift,\"\
  \ \"holdout test,\" \"how did you hear about us,\" \"self-reported attribution,\"\
  \ \"dark social,\" or wants to instrument attribution themselves \u2014 \"stitch\
  \ my bookings to their source,\" \"SavvyCal/Calendly attribution,\" \"close the\
  \ identify gap,\" \"track conversions on a third-party domain,\" \"first-party /\
  \ self-hosted attribution.\" For event tracking setup and UTMs, see analytics. For\
  \ ad-platform pixels/CAPI and conversion tracking, see conversion-tracking. For\
  \ pipeline and CRM revenue reporting, see revops. For the AI-search attribution\
  \ blind spot, see ai-seo."
