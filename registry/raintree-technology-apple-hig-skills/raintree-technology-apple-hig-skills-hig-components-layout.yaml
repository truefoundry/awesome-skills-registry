  "how should I organize my app", "what navigation pattern should I use", "my layout
  breaks on iPad", "how do I build a sidebar", "should I use tabs or a sidebar", or
  "my app doesn''t adapt to different screen sizes". Cross-references: hig-foundations
  for layout/spacing principles, hig-platforms for platform-specific navigation, hig-patterns
  for multitasking and full-screen, hig-components-content for content display.'
