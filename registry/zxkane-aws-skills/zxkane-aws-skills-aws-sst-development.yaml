id: zxkane-aws-skills-aws-sst-development
display_name: aws-sst-development
description: "SST v4 (Ion) expert for managing AWS resources as code with the Pulumi-backed\
  \ framework. Use when writing or editing sst.config.ts, building infra/ modules\
  \ (sst.aws.Function/Bucket/Dynamo/Cron/Service/Router, sst.Secret, sst.Linkable,\
  \ raw aws.* Pulumi resources), wiring resource links, scoping IAM, or running sst\
  \ deploy/dev/diff/remove. Essential when the user mentions SST, sst.config.ts, $config,\
  \ $transform, $interpolate, sst.aws.*, sst.Secret, Pulumi/Ion, \"sst deploy\", a\
  \ failed SST deploy (ConflictException on a resource-type change, \"Identifier '__filename'\
  \ has already been declared\", MalformedPolicyDocument on an Output<T>), or wants\
  \ to scaffold/troubleshoot AWS infrastructure with SST. Also use when a request\
  \ to \"deploy my AWS stack\" or \"add a Lambda/bucket/table\" is made in a repo\
  \ that already contains an sst.config.ts (using $config) or an sst dependency. Do\
  \ NOT use when the task is primarily AWS CDK, Terraform, raw CloudFormation, or\
  \ SAM with no SST present \u2014 those have their own tooling."
