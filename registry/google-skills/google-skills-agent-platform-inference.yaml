id: google-skills-agent-platform-inference
display_name: agent-platform-inference
description: Connects to and performs inference with Google Cloud Agent Platform GenAI
  models, including First-Party Gemini models and Third-Party OpenMaaS models (Llama,
  DeepSeek, Qwen, etc.). Use when asked to perform inference, ask a model a question,
  run a test prompt, execute chat completions, or generate code for calling Gemini
  or OpenMaaS models, authenticate with GenAI SDK, OpenAI SDK, or legacy Agent Platform
  SDK, configure base URLs and global/regional endpoints, or troubleshoot 429 Resource
  Exhausted (DSQ), 400 User Validation, or 404 Not Found errors. Don't use for deploying
  models to endpoints or for running model evaluations.
