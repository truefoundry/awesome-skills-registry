id: google-skills-gke-node-notready
display_name: gke-node-notready
description: Diagnoses GKE nodes reporting NotReady or Unknown status by inspecting
  node conditions, events, kubelet/containerd logs, and node metrics, then proposing
  safe remediations. Use when nodes show NotReady, when the kubelet stops posting
  node status, or when workloads are evicted or stuck Pending due to node health.
  Don't use for pod-level application failures (use gke-workload-troubleshooting),
  autoscaler scale-up/scale-down decisions (use gke-cluster-autoscaler), or non-GKE
  compute.
