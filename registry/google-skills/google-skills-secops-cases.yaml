display_name: secops-cases
description: Manage Google Security Operations (SecOps) SOAR cases throughout their
  lifecycle. Use when listing, creating, inspecting, updating, or closing SOAR cases;
  adding investigative comments and notes; updating case priority or description;
  or linking and grouping security alerts within cases. Supports both remote Google
  SecOps MCP tools and local fallback tools. Don't use for SIEM UDM searches or detection
  rule authoring.
