id: google-skills-google-cloud-solution-guided-gke-ai-migration
display_name: google-cloud-solution-guided-gke-ai-migration
description: Guides the migration of existing AI workloads (Cloud Run, Gemini API,
  Gemini Enterprise Agent Platform) to self-hosted GKE inference using gcloud and
  kubectl. Use when the user has an existing AI inference workload (on Cloud Run,
  the Gemini API, Gemini Enterprise Agent Platform, or a custom VM) and wants to move
  it to self-hosted inference on GKE, or asks follow-up questions during such a migration
  (hardware sizing, model staging, manifest generation, validation, traffic cutover).
  DO NOT use for brand new GKE inference deployments with no existing workload to
  migrate (use gke-inference instead). DO NOT use if the user intends to automate
  the migration via the Gemini Cloud Assist MCP server.
