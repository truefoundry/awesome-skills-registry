  bidirectional multi-agent AI systems that process continuous streams of multimodal
  data for real-time technical guidance and safety monitoring. Generates a custom
  Google Cloud solution that uses opinionated best practices and architecture guidance.
  Use when users need agentic assistance to design and create a multi-product solution
  in the cloud for live bidirectional multimodal streaming workloads. Don't use for
  simple text-based chat applications or workloads without real-time streaming requirements.
