id: google-skills-agent-platform-alert-configuration
display_name: agent-platform-alert-configuration
description: 'Configures best-practice alerting policies for AI agents using OpenTelemetry
  (OTel) metrics, generating output as Terraform (.tf) configuration files. Use when
  analyzing, writing, or deploying alerting policies to monitor agent latency, error
  rates, token usage, and quality metrics. Don''t use for standard infrastructure
  monitoring unrelated to AI agents, or when the agent is not instrumented with OpenTelemetry
  (for Reliability, Cost, Safety, Security alerts). NOTE: Reliability, Cost, Safety,
  and Security alerts use generic OTel metrics and work across runtimes (such as Cloud
  Run, Vertex AI). Quality alerts rely on Vertex AI Online Monitors and are strictly
  bound to Vertex AI deployments.'
