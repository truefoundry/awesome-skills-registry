id: google-skills-cloud-trace-querying
display_name: cloud-trace-querying
description: Query Cloud Trace spans, filter by latency thresholds or error status,
  correlate distributed traces with Cloud Logging, and diagnose latency bottlenecks
  across Google Cloud services. Use when investigating slow requests, analyzing trace
  hierarchies, or resolving latency regressions. Do NOT use for querying non-GCP telemetry
  or database query optimization outside Cloud Trace.
