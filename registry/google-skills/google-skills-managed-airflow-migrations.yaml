id: google-skills-managed-airflow-migrations
display_name: managed-airflow-migrations
description: Provides guidance for migrating Apache Airflow DAGs in Managed Service
  for Apache Airflow (MSAA; formerly Cloud Composer). Covers migration to Airflow
  2.11.1 (MSAA Gen 2 and 3) and Airflow 3 (MSAA Gen 3), including environment inspection,
  GCS download/upload and scanning patterns for breaking changes. Use when migrating
  the DAG code to newer Airflow version. Don't use when checking DAG run failures
  unrelated to code migration.
