description: Deploys a baseline landing zone foundation for a Google Cloud Organization,
  establishing security guardrails using Organization Policies, resource hierarchy
  folders and projects, billing association, and centralized logging and monitoring.
  Deploys Google Cloud's recommended security controls and architecture. Use when
  setting up a new Google Cloud Organization or establishing a secure, enterprise-grade
  landing zone foundation. Don't use for individual project onboarding (use google-cloud-recipe-onboarding
  or product-specific skills instead).
