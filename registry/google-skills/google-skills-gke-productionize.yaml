description: Orchestrates comprehensive production readiness reviews and assessments
  for GKE clusters and workloads across scalability, security, reliability, observability,
  backup/DR, and cost optimization. Use when asked to productionize, prepare, assess,
  audit, or review a GKE cluster or workload before going live to production. Don't
  use for deep-dive single-domain implementation (use specific domain skills like
  gke-workload-scaling, gke-platform-security, gke-workload-security, gke-service-networking,
  gke-reliability instead).
