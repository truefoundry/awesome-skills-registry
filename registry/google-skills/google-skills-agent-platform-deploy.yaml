id: google-skills-agent-platform-deploy
display_name: agent-platform-deploy
description: "Deploy open models or custom weights from Model Garden to Agent Platform\
  \ endpoints, check the status of an in-progress deployment operation, or clean up\
  \ resources by undeploying models and deleting endpoints. Use when asked to actively\
  \ deploy a model, list the Model Garden CATALOG of available models, check if a\
  \ specific model is deployable (`gcloud ai model-garden models list-deployment-config`),\
  \ query deployment cost, troubleshoot deployment errors (like quota limits), or\
  \ undeploy/clean up endpoints. Also use when copying and deploying a 1P Tuned Model.\
  \ Don't use for pure listing/discovery questions of the form \"is X deployed?\"\
  , \"list my endpoints\", or \"which regions have models running?\" \u2014 for those\
  \ use `agent-platform-endpoint-management`. Don't use for running model evaluations\
  \ (use `agent-platform-eval-flywheel` skill)."
