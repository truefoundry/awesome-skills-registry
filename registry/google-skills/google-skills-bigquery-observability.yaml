id: google-skills-bigquery-observability
display_name: bigquery-observability
description: Provides data-retrieval best practices, tool selection guidance, and
  performant SQL query syntax for BigQuery telemetry across INFORMATION_SCHEMA, Cloud
  Monitoring, and the REST API. Use when the telemetry to fetch is already known,
  selecting telemetry tools, writing performant INFORMATION_SCHEMA queries, retrieving
  telemetry for diagnosing single-job performance bottlenecks, investigating slot
  contention, job concurrency and queue latency, analyzing reservation capacity, utilization
  and autoscaling saturation, or auditing capacity-based and on-demand compute and
  storage resource billable usage. Don't use for root-cause diagnosis or symptom troubleshooting
  when the cause is unknown (use bigquery-troubleshooting first), or for writing or
  optimizing business logic SQL (use bigquery-optimization).
