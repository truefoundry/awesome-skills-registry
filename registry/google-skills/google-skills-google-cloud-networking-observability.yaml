id: google-skills-google-cloud-networking-observability
display_name: google-cloud-networking-observability
description: Investigates Google Cloud networking issues by analyzing GCP logs, metrics,
  and diagnostics. Use when investigating dropped network traffic, packet drops, drop
  reasons, VPC Flow Logs (including Private Service Connect / PSC, serverless / App
  Engine Direct VPC, and cost estimation), NAT, firewall, or threat logs, querying
  latency and throughput metrics, or running Connectivity Tests for path diagnostics.
  Don't use for generic VM management or non-observability tasks.
