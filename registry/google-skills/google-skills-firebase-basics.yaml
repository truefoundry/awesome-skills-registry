id: google-skills-firebase-basics
display_name: firebase-basics
description: Provides foundational Firebase CLI setup, CLI installation, version checks
  (`firebase-tools@latest --version`), CLI login (including --no-localhost), project
  creation, project selection (`firebase use`), and app config file downloads (`google-services.json`,
  `GoogleService-Info.plist`). Use ONLY for CLI login, project creation/switching,
  or downloading app config files. Don't use for Firebase Hosting deploy, Firestore,
  Auth, App Hosting, Data Connect, Crashlytics, or Remote Config.
