id: google-skills-gke-ai-troubleshooting-node-unresponsive-timeout
display_name: gke-ai-troubleshooting-node-unresponsive-timeout
description: Diagnose and mitigate GKE TPU or GPU nodes stuck in NotReady / NodeStatusUnknown
  ("Kubelet stopped posting node status") due to host kernel panics, hardware lockups,
  or disabled node auto-repair. Use when nodes stop heartbeating beyond the node auto-repair
  threshold and pods remain stuck in Terminating. Don't use for healthy nodes, pod-only
  application crashes, or routine GKE upgrades.
