id: google-skills-gke-ai-troubleshooting-handle-disruption-gpu-tpu
display_name: gke-ai-troubleshooting-handle-disruption-gpu-tpu
description: Diagnoses, predicts, and mitigates node disruptions during Compute Engine
  host maintenance and hardware or software maintenance events for GPU and TPU workloads
  on GKE. Use when diagnosing node disruptions, predicting host maintenance events
  on GPU/TPU nodepools, inspecting node interruption PromQL metrics, auditing node
  taints, or configuring workload protection strategies (graceful termination, opportunistic
  maintenance, PodDisruptionBudgets). Don't use for general GKE cluster creation,
  network policy configuration, or non-disruption workload deployment.
