id: google-skills-compute-vm-creation
display_name: compute-vm-creation
description: Guides the planning, configuration, and provisioning of standalone Google
  Compute Engine virtual machines (VMs) and bare metal (-metal) instances using gcloud
  CLI commands or direct MCP tool execution. Use ONLY when the user wants to create,
  configure, or provision a new standalone Compute Engine VM or bare metal instance
  from conversational intents (hardware sizing, region selection, OS image, networking,
  security defaults). DO NOT read or use for Google Kubernetes Engine (GKE) Autopilot
  or Standard clusters, Kubernetes node pools or Pods, container orchestration, managing
  existing VMs, Managed Instance Groups (MIGs), or Instance Templates.
