id: google-skills-google-cloud-filestore-autoscale
display_name: google-cloud-filestore-autoscale
description: Inspects Filestore capacity and utilization on Google Cloud, evaluates
  storage scaling rules, and performs capacity autoscaling (scale UP for low free
  space or scale DOWN for cost optimization). Use when monitoring Filestore instance
  headroom, resizing instance shares, configuring automated growth/shrink thresholds
  (custom thresholds apply globally across projects in session memory), or preventing
  out-of-space outages. Don't use for Cloud Storage (GCS) buckets, Persistent Disk
  block storage, or NetApp Volumes.
