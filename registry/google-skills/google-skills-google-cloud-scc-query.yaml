id: google-skills-google-cloud-scc-query
display_name: google-cloud-scc-query
description: Queries and retrieves active security findings, external exposures, toxic
  combinations, vulnerabilities, threats, and sensitive data risks from Security Command
  Center on Google Cloud. Use when retrieving details for a security finding by its
  name, validating finding scope (e.g., verifying findingClass is TOXIC_COMBINATION,
  VULNERABILITY, EXTERNAL_EXPOSURE, or THREAT), or fetching finding details for triage.
  Don't use to draft remediations, apply patches, or execute configurations.
