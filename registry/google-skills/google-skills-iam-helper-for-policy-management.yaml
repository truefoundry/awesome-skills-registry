id: google-skills-iam-helper-for-policy-management
display_name: iam-helper-for-policy-management
description: Streamlines the creation, modification, and management of IAM allow policies
  (v1) and deny policies (v2). Manages access control across Resource Manager resources
  (Organization, Folder, Project) and individual resources. Use when creating, updating,
  listing, or deleting IAM allow policies or deny policies. Don't use for access denial
  troubleshooting (use iam-helper-for-troubleshooting), temporary privileged access
  (use iam-helper-for-privileged-access-management), configuring VPC Service Controls,
  or managing network firewall rules.
