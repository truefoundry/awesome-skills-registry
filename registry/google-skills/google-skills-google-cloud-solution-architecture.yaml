id: google-skills-google-cloud-solution-architecture
display_name: google-cloud-solution-architecture
description: Interactively discovers requirements and designs holistic, multi-product
  system architectures, solution blueprints, and deployment recommendations for complex
  workloads on Google Cloud. Use when designing end-to-end cloud solutions, selecting
  and integrating Google Cloud services, generating architecture diagrams, or conducting
  requirements discovery for new cloud workloads or migrations. Don't use for single-product
  tasks (use product-specific skills), initial onboarding or authentication (use google-cloud-recipe-*),
  Well-Architected Framework reviews or audits (use google-cloud-waf-*), or workloads
  covered by specialized solution skills.
