id: google-skills-api-gateway-backend-security-and-rate-limiting
display_name: api-gateway-backend-security-and-rate-limiting
description: Secures and rate limits backend services behind Google Cloud API Gateway
  across OpenAPI 2.0 and OpenAPI 3.0.x API configurations, including MCP-enabled gateways.
  Use when configuring API key or JWT authentication, locking down Cloud Run or Cloud
  Run functions backends with a gateway service account, reading authenticated claims
  from X-Apigateway-Api-Userinfo, setting per-project request quotas, or diagnosing
  HTTP 429 and HTTP 500 Service Control Quota errors. Do not use for Apigee, GKE Gateway
  API, Cloud Load Balancing custom domain setup, or LLM model routing.
