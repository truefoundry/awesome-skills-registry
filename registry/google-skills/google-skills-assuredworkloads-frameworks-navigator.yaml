id: google-skills-assuredworkloads-frameworks-navigator
display_name: assuredworkloads-frameworks-navigator
description: Acts as a Data Boundary Compliance Analyst that maps user compliance
  queries against Data Boundary Frameworks and cloud controls, validates matched resources,
  and recommends appropriate Frameworks or cloud controls. Use when mapping direct
  natural language workload requirements to Assured Workloads / Data Boundary Frameworks
  and cloud controls, browsing built-in Data Boundary frameworks, or identifying major
  requirement gaps. Don't use for non-Data-Boundary Compliance Manager posture assessments
  or direct Terraform deployment execution without framework selection.
