id: google-skills-compute-future-reservations
display_name: compute-future-reservations
description: Evaluates future GPU and TPU reservation feasibility and calendar-mode
  booking options in Google Compute Engine (GCE). Use when planning future AI/ML training
  runs, checking reservation availability windows, verifying accelerator cluster topologies,
  or assessing future capacity lead times. Don't use for active on-demand reservations
  (use compute-on-demand-reservations), immediate Spot capacity queries (use compute-spot-capacity-advice),
  or Standard Future Reservations (--reservation-mode=DEFAULT).
