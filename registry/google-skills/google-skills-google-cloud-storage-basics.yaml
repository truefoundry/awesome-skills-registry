id: google-skills-google-cloud-storage-basics
display_name: google-cloud-storage-basics
description: "Stores, retrieves, and manages data as objects in Cloud Storage on Google\
  \ Cloud (also known colloquially as GCS) buckets. Use when you need to interact\
  \ with Cloud Storage \u2014 set up a Storage MCP server (remote or local Toolbox),\
  \ create or configure buckets, upload, download, stream, or transfer data, organize\
  \ objects with folders, generate signed URLs, control access (IAM, ACLs, public\
  \ access prevention), set storage classes (Standard, Nearline, Coldline, Archive),\
  \ manage lifecycle and cost, protect data (versioning, CMEK, retention, Bucket Lock,\
  \ holds, soft delete), host static websites, trigger Pub/Sub notifications, mount\
  \ buckets (gcsfuse), or optimize performance. Covers gcloud storage / gsutil, JSON/XML\
  \ APIs, client libraries, Terraform, and Cloud Storage MCP servers. Don't use for\
  \ generic MCP setup that doesn't mention Cloud Storage, other MCP servers, block\
  \ storage (Persistent Disk), BigQuery, or databases (Cloud SQL, Spanner, Bigtable,\
  \ Firestore)."
