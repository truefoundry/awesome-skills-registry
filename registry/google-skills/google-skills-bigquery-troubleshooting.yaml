id: google-skills-bigquery-troubleshooting
display_name: bigquery-troubleshooting
description: Provides diagnostic workflows and step-by-step root-cause analysis procedures
  for actively broken, failing, or slow BigQuery jobs, execution graph and query plan
  stage bottlenecks, system performance issues, or unexpectedly expensive workloads.
  Use when interpreting symptoms, isolating bottlenecks, diagnosing cost spikes (on-demand
  query spend, capacity slot autoscaling, storage growth), execution graph stages
  or substep variables, identifying root causes, and determining remediation steps.
  Don't use for writing or optimizing SQL, proactive capacity planning, or storage
  layout design (use bigquery-optimization), or when the user already knows which
  telemetry they want and just needs the query (use bigquery-observability).
