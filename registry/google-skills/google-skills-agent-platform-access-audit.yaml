id: google-skills-agent-platform-access-audit
display_name: agent-platform-access-audit
description: Audits AI agent data access, blast radius, and blocked policy operations
  in Google Cloud by querying Cloud Audit Logs via BigQuery. Use when investigating
  what resources or services an agent accessed, identifying top originating principals
  the agent is acting as, or triaging PERMISSION_DENIED errors to distinguish VPC
  Service Controls perimeter violations from IAM permission denials. Don't use for
  configuring Cloud Monitoring alert policies, modifying IAM policies or VPC Service
  Controls perimeters, querying non-audit application logs, or performing write operations.
