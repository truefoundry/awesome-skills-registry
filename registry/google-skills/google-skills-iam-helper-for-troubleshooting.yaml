id: google-skills-iam-helper-for-troubleshooting
display_name: iam-helper-for-troubleshooting
description: 'Diagnoses, remediates, and manages Identity and Access Management (IAM)
  access issues on Google Cloud. Supports two distinct operational modes: (1) Requester
  Flow for developers encountering access denials (capturing error context, self-service
  PAM JIT activations, elevated developer self-remediation, or logging structured
  tickets), and (2) Resolver Flow for privileged administrators (authoritative Policy
  Troubleshooter analysis, deny policy exemptions, least-privilege role discovery,
  and PAM/IAM provisioning).'
