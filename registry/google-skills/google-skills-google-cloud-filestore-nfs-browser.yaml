id: google-skills-google-cloud-filestore-nfs-browser
display_name: google-cloud-filestore-nfs-browser
description: Inspects, searches, and reads files and POSIX metadata on Filestore (NFS)
  instances on Google Cloud without local NFS client packages or root privileges.
  Use when browsing Filestore shares, searching files, reading remote logs, or inspecting
  file attributes; don't use for Cloud Storage buckets, Cloud NetApp Volumes, Persistent
  Disks, or modifying/deleting files.
