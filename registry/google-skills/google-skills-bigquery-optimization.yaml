id: google-skills-bigquery-optimization
display_name: bigquery-optimization
description: Provides workflows to optimize BigQuery environments (capacity planning,
  editions), storage assets (partitioning, clustering, storage lifecycles, billing
  models), and SQL queries. Use when optimizing cost, modeling Edition migrations,
  rightsizing reservations, evaluating logical vs. physical storage, designing table
  partitioning/clustering, generating table DDL, migrating unpartitioned tables, managing
  partition expiration, optimizing individual SQL queries, or evaluating acceleration
  structures (search indexes, materialized views, BI Engine). Do not use for raw usage
  reporting (use bigquery-observability), query execution plan analysis, error troubleshooting,
  or diagnosing why a specific job was slow (use bigquery-troubleshooting).
