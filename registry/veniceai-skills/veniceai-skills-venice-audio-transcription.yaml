id: veniceai-skills-venice-audio-transcription
display_name: venice-audio-transcription
description: Transcribe audio files to text via POST /audio/transcriptions. Covers
  supported models (Parakeet, Whisper, Wizper, Scribe, xAI STT), accepted containers
