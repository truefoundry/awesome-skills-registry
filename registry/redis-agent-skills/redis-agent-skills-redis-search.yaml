id: redis-agent-skills-redis-search
display_name: redis-search
description: Redis Search guidance covering FT.CREATE schema design, field type selection
  (TEXT, TAG, NUMERIC, GEO, GEOSHAPE, VECTOR, JSON path), DIALECT 2 query syntax,
  FT.SEARCH / FT.AGGREGATE / FT.HYBRID command selection, vector similarity with HNSW
  or FLAT, hybrid retrieval combining lexical and vector ranking, RAG pipelines, zero-downtime
  index updates via aliases, and debugging with FT.PROFILE and FT.EXPLAIN. Use when
  defining a search index on Hash or JSON documents, writing FT.SEARCH queries with
  filters, sorting, aggregation, or vector KNN, tuning HNSW parameters, building a
  RAG retrieval pipeline, or troubleshooting slow or empty search results.
