id: redis-agent-skills-add-intent-router
display_name: add-intent-router
description: Replace an existing agent's hand-written routing (keyword if/else chains,
  regex, or an LLM call that only picks a route) with a Redis Iris Intent Router through
  redis-iris, so a message maps to a defined intent and its dispatch target by example
  phrasings and a score threshold. Asks five questions (what the routes are today,
  a few real phrasings per route, what each route dispatches to, what happens when
  nothing matches, which embedding model), writes the answers to intents.yaml, provisions
  the Router from the terminal with `iris intent-router service create`, loads the
  intents with `iris intent-router intents add`, then wires `router.match()` where
  the agent decides today. Use when the agent routes with keywords or an extra LLM
  call, or the user asks for intent detection, intent routing, or semantic routing.
