id: redis-agent-skills-add-lens
display_name: add-lens
description: Add Redis Iris Lens tracing to an existing AI agent through redis-iris,
  so every agent turn is one trace in the Lens UI with its LLM calls, tokens, tool
  calls, memory and document retrievals, and which of them entered the prompt. Detects
  how the agent runs (LangGraph or ADK attach, workflows.turn, another framework,
  or a plain loop), installs redis-iris[llm-tracing], calls lens.init(agent_id=...),
  opens one lens.turn() per turn where Iris does not open it already, and covers coexistence
  with an OpenTelemetry setup or LLM instrumentation the app already has. Use when
  the user asks to add Lens, tracing, observability, or per-turn traces to their agent,
  or asks why their Lens traces are missing.
