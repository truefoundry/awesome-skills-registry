id: NVIDIA-skills-doca-debug
display_name: doca-debug
description: "Use this skill when the user is debugging any DOCA symptom \u2014 a\
  \ build that won't compile, a link step that can't resolve a doca_* symbol, a runtime\
  \ call returning DOCA_ERROR_*, a silent service or tool, or a stack trace / valgrind\
  \ / core dump \u2014 and needs the layered ladder (install \u2192 version \u2192\
  \ build \u2192 link \u2192 runtime \u2192 program \u2192 driver), verbosity controls\
  \ (--sdk-log-level, DOCA_LOG_LEVEL, the doca-{lib}-trace flavor), container-debug\
  \ constraints, or how to capture state for a Developer Forum post. Trigger even\
  \ when the user does not say \"DOCA debug\" \u2014 implicit phrasings include \"\
  undefined reference to doca_*\", \"how do I get more logs\", \"packets aren't reaching\
  \ the wire\", \"doca_caps returned nothing\", or \"hugepages empty in the container\"\
  . Refuse and route elsewhere for library-specific debug (Flow pipe trace, RDMA QP,\
  \ Comch stats), env-class pkg-config or hugepages symptoms, the DOCA_ERROR_* taxonomy\
  \ and lifecycle interpretation, and performance or incident-response work \u2014\
  \ those belong to other skills."
