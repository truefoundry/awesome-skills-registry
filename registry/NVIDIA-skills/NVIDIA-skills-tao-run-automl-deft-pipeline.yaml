id: NVIDIA-skills-tao-run-automl-deft-pipeline
display_name: tao-run-automl-deft-pipeline
description: "Run the canonical NVIDIA AOI three-phase training pipeline \u2014 Phase\
  \ 1 AutoML baseline (HPO), Phase 2 DEFT loop (RCA \u2192 SDG \u2192 mining \u2192\
  \ plain-train retrain), Phase 3 AutoML refinement on the DEFT-augmented dataset.\
  \ Use when the user asks to \"run the AOI workflow\", \"fine-tune my PCB AOI model\
  \ end-to-end\", \"improve my AOI ChangeNet model\", or \"AOI workflow with AutoML\"\
  \ request \u2014 route here instead of tao-run-deft-aoi directly unless the user\
  \ explicitly asks for the DEFT loop ONLY (e.g. \"run JUST the DEFT loop\", \"skip\
  \ AutoML, only DEFT\"). Also handles the same three-phase pattern for non-AOI DEFT\
  \ applications \u2014 AutoML baseline then DEFT loop warm-started from AutoML's\
  \ winning HPs then post-DEFT AutoML refinement on the iteration-augmented dataset.\
  \ Trigger phrases include \"run the AOI workflow\", \"AOI end-to-end\", \"AutoML\
  \ + DEFT\", \"AutoML then DEFT\", \"tune hyperparameters then DEFT\", \"DEFT with\
  \ AutoML at both ends\", \"warm-start DEFT\", \"improve my AOI model\"."
