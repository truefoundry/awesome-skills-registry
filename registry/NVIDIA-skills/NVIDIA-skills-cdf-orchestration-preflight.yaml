id: NVIDIA-skills-cdf-orchestration-preflight
display_name: cdf-orchestration-preflight
description: Set up missing Linux prerequisites and audit whether a Cosmos Data Factory
  (CDF) Orchestration checkout and its Kubernetes or OSMO environment are ready to
  install the controller and run every packaged DAG. Use for prerequisite, pre-setup,
  Kubernetes, GPU, RWX/NFS, credential, controller-readiness, and quick-start checks.
  Not for deploying the controller (use cdf-orchestration-setup, which calls this
  audit first), authoring payloads, or running workflows.
