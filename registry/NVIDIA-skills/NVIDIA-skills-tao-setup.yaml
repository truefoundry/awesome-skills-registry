id: NVIDIA-skills-tao-setup
display_name: tao-setup
description: One-time session setup and orchestration map for the TAO skill bank.
  Run this first when the TAO skills were installed individually (e.g. from a public
  skills catalog) so the session gets the cross-skill discovery flow, credential checks,
  and host preflight that the bundled plugin hook would otherwise inject automatically.
  Trigger phrases include "set up TAO skills", "TAO session setup", "prepare TAO environment",
  "TAO getting started".
