id: NVIDIA-skills-doca-devemu
display_name: doca-devemu
description: "Use this skill when the user is doing hands-on DOCA Device Emulation\
  \ on a BlueField DPU \u2014 exposing a custom emulated PCIe device the host sees\
  \ as a real peripheral while DPU-side code runs the backend, picking the sub-library\
  \ (PCI Generic, virtio-net, virtio-fs), wiring the per-sub-library Core context\
  \ plus doorbell / DMA primitives, querying `doca_devemu_*_cap_*`, or debugging DOCA_ERROR_*\
  \ from a `doca_devemu_*` call. Trigger even when the user does not say \"devemu\"\
  \ \u2014 typical implicit phrasings include \"expose a custom PCIe device from BlueField\
  \ to the host\", \"host should see a virtio NIC backed by my DPU code\", \"lspci\
  \ does not show my emulated device\", \"device enumerated but no driver binds\"\
  , \"DPU sees nothing when host kicks the queue\", or \"virtio feature negotiation\
  \ failed at bind\". Refuse and route elsewhere for the packaged DOCA SNAP / Virtio-net\
  \ Services, host-side virtio kernel drivers, backend body design, or standard BlueField\
  \ NIC behavior \u2014 those belong to other skills."
