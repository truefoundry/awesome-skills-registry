id: NVIDIA-skills-tao-finetune-huggingface-model
display_name: tao-finetune-huggingface-model
description: 'Fine-tune any HuggingFace CV / VLM / LLM model on local NVIDIA GPUs
  inside an NGC PyTorch container when no dedicated TAO model skill matches. Use when
  the user wants to fine-tune a HuggingFace model (full or LoRA), train a vision /
  VLM / LLM model end-to-end, generate a reproducible HF training pipeline, smoke-test
  a HuggingFace model locally before scale-up, push a fine-tuned model to the HF Hub
  with a model card, or emit a self-contained rerun skill for an existing HuggingFace
  finetune. Supports image classification, object detection, semantic / instance /
  panoptic segmentation, depth estimation, image-text-to-text VLM (SFT / LoRA), and
  LLM SFT / DPO / GRPO. Six-step workflow: inspect and qualify, hardware and NGC image,
  research, generate and smoke, train + eval + infer, push and emit rerun skill. Do
  not use for any Hugging Face model ID claimed by a dedicated `skills/models/*` skill;
  the model skill and its declared execution environment take precedence.'
