id: NVIDIA-skills-runai-audit-assigned-quota
display_name: runai-audit-assigned-quota
description: "Audit GPU quota fairness across a Run:ai cluster \u2014 find which projects\
  \ are starved and which are borrowing over their deserved quota in each node pool,\
  \ and where GPUs can be reclaimed. Use when an admin asks \"who is over quota in\
  \ node-pool X\", \"which projects are starved\", \"is the cluster shared fairly\"\
  , \"where can I reclaim GPUs\", \"show deserved vs allocated by project or department\"\
  , or when a team reports it can't get GPUs and you suspect unfair borrowing. This\
  \ is the quota / fairness axis (deserved vs allocated). For idle-but-held GPUs use\
  \ runai-get-utilization-overview; for a health/scheduling verdict use runai-get-cluster-health-summary."
