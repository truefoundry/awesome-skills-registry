id: NVIDIA-skills-tao-train-nvpanoptix3d
display_name: tao-train-nvpanoptix3d
description: NVPanoptix3D for panoptic 3D scene reconstruction from posed RGB images.
  Produces 3D panoptic segmentation (semantic, instance, and panoptic masks) with
  occupancy completion. Built on a VGGT backbone with a Mask2Former-style head and
  3D frustum reconstruction. Use when training, evaluating, exporting, or running
  inference for a TAO NVPanoptix3D model. Trigger phrases include "train NVPanoptix3D",
  "panoptic 3D reconstruction", "3D scene segmentation", "occupancy completion".
