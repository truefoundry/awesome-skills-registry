description: "Co-DETR (CoDINO) for object detection. A DETR-family detector with collaborative\
  \ hybrid assignment \u2014 auxiliary one-to-many heads supervise the encoder during\
  \ training, giving strong closed-set accuracy at high inference cost. Use when training,\
  \ evaluating, or running inference for a TAO Co-DETR model. Trigger phrases include\
  \ \"train Co-DETR\", \"run CoDINO\", \"codetr inference\", \"collaborative DETR\"\
  , \"autolabel detections with Co-DETR\"."
