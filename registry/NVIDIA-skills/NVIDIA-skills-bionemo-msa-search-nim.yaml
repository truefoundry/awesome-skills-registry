id: NVIDIA-skills-bionemo-msa-search-nim
display_name: msa-search-nim
description: Generate multiple sequence alignments (MSAs) for protein sequences using
  the ColabFold MSA-Search NIM. Use for homolog search, UniRef30/ColabFold env searches,
  A3M or FASTA alignments, paired MSA search for complexes, PDB70 structural templates,
  hosted NVIDIA API calls, or local Docker deployment. For local deployment, download
  the databases in parallel with aria2c and launch via NIM_MODEL_NAME (the recommended
  default fast path, ~14 min vs over 80 min for the built-in downloader); a plain
  docker run uses the slow built-in downloader.
