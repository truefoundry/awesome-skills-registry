id: NVIDIA-skills-vss-build-vision-ai
display_name: vss-build-vision-ai
description: "Add agent-ready vision capabilities \u2014 dense captioning, detection,\
  \ search, alerting, summarization \u2014 to an agent or application through a customizable,\
  \ self-contained vision stack built on the NVIDIA VSS Blueprint. Use this skill\
  \ when a developer or agent wants to give their app vision: pick capabilities via\
  \ guided intake (\"build a vision agent\", \"add vision capabilities\") or describe\
  \ them in natural language (\"create a profile for streaming dense captioning\"\
  , \"add agentic search to my base deployment\", \"deploy warehouse 3d\"). Route,\
  \ compose, configure, and deploy stock base, alerts, LVS, search developer profiles,\
  \ or the warehouse industry profile and lean custom combinations expressed as delta\
  \ overlays using one current developer profile as the Foundation. Not for operating\
  \ a stack that is already deployed \u2014 searching, asking about a video, summarizing,\
  \ managing alerts, or generating a report \u2014 and not for deploying a single\
  \ microservice on its own; use the matching vss-* skill for those."
