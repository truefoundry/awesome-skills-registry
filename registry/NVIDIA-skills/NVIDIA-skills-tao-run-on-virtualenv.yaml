display_name: tao-run-on-virtualenv
description: "Run a Python training/eval script directly in an existing local virtualenv\
  \ \u2014 no docker, no container. Implements the four-verb consumer contract (submit/status/logs/cancel)\
  \ over a vendored process-lifecycle runner with durable on-disk state, PID-reuse-safe\
  \ identity, and process-group cleanup. Use for docker-free local execution, plain-Python\
  \ model scripts, fast HPO/AutoML trial smokes, or hosts where containers are unavailable.\
  \ Trigger phrases include \"run in my venv\", \"no docker\", \"virtualenv execution\"\
  , \"local python training\", \"run this training script directly\"."
