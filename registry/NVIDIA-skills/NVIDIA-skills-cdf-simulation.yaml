id: NVIDIA-skills-cdf-simulation
display_name: cdf-simulation
description: "Component-owned guidance for CDF Simulation requests submitted directly\
  \ or through Airflow-triggered DIG Flow Catalog prompts \u2014 golden THT board,\
  \ THT pin-geometry variation, good/clean SMT images, structural pose defects, and\
  \ solder texture defects, from a board USD. Turns one matched prompt into one validated\
  \ `cdf.CDFJob` build and its compiled JobOrder payload; it never executes a render\
  \ itself. Requires a caller-supplied board USD and output root, asks for either\
  \ when missing from an interactive request, and resolves optional details with fixed,\
  \ documented defaults."
