description: Convert existing PyTorch Lightning training code into an NVFLARE federated
  job using the Lightning Client API patch, local validation, and job export; use
  only when the request names federated/NVFLARE conversion or asks multiple sites
  to train collaboratively while keeping each site's data local, and either names
  PyTorch Lightning or preliminary source inspection identifies one Lightning owner;
  do not use for non-federated Lightning work such as DDP, profiling, inference serving,
  or training-loop changes, nor for plain PyTorch, TensorFlow/Keras, other frameworks,
  deployment, POC/production lifecycle, or experiment workflows.
