description: 'WARNING: guides IRREVERSIBLE BlueField-4 hardware operations (PLDM firmware
  burns, ISO reflashes, power cycles, BMC factory resets); every mutating step is
  governed by doca-hardware-safety (window, rollback). BlueField-4 only: BlueField-3
  bring-up is doca-bf3-deployment. Use this skill for BlueField-4 (BF4) day-1 platform
  bring-up from the BMC: installing the BlueField/DOCA bundle ISO onto the DPU (Grace,
  the Arm complex) over UEFI HTTP Boot, PXE, or Redfish Virtual Media; the PLDM platform-firmware
  update via the Redfish UpdateService and pldmtool; and a Grace Ubuntu image with
  optional cloud-init. Trigger on BlueField-4/BF4 bring-up phrasings even without
  "BF4": {bring up my new BlueField-4}, {the BlueField ISO will not boot over HTTP
  from the BMC}, {attach BF4 virtual media via Redfish}, {BF4 firmware Task stuck
  at Running}, {prepare a BlueField-4 host: platform support, version alignment, safest
  first smoke test}. Route application launch and library APIs to other skills.'
