id: NVIDIA-skills-cdf-defect-image-generation
display_name: cdf-defect-image-generation
description: Generate synthetic PCB inspection images on Kubernetes with the SMT Defect
  Image Generation (DIG) DAG in CDF Orchestration. The DAG renders components in simulation,
  turns the renders into realistic golden images (sim2real), and uses AnomalyGen to
  add texture defects such as solder bridges, excess solder or missing components.
  Simulation can also render shift, tombstone and sideflip pose defects. Use it to
  build DIG payloads, pick a pipeline mode (full, simulation, sim2real or defect-only),
  check GPU readiness, follow a run, and match each defect image to its golden and
  simulated source. Not for running Simulation, Augmentation or AnomalyGen on their
  own.
