id: NVIDIA-skills-tao-train-dinov3
display_name: tao-train-dinov3
description: DINOv3 continual self-supervised pre-training. Domain-adapts public DINOv3
  ViT backbones on unlabeled images via teacher-student self-distillation (DINO +
  iBOT + KoLeo, optional Gram anchoring) and converts the EMA teacher into a timm-format
  backbone for downstream tasks. Trigger phrases include "train DINOv3", "DINOv3 SSL",
  "domain-adapt a foundation backbone", "continual pretraining", "self-supervised
  finetune DINOv3".
