id: NVIDIA-skills-nvalchemi-toolkit
display_name: nvalchemi-toolkit
description: Build and change NVIDIA ALCHEMI Toolkit (nvalchemi) workflows for atomistic
  simulation and machine-learned interatomic potentials (MLIPs). Use for batched structure
  relaxation, molecular dynamics, reaction paths, training or fine-tuning an MLIP,
  atomistic datasets in Zarr, generative structure workflows, model wrapping, and
  custom hooks or integrators, with the ALCHEMI Toolkit (nvalchemi), or when the user
  asks for batched GPU atomistic simulation and nvalchemi is installed or acceptable.
  Not for other simulation packages the user asked for (ASE-only, OpenMM, LAMMPS,
  GROMACS) when the request does not involve nvalchemi, ALCHEMI Toolkit-Ops (nvalchemiops)
  kernel work, or plain PyTorch questions.
