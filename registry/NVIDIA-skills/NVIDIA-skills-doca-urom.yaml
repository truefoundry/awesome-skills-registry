id: NVIDIA-skills-doca-urom
display_name: doca-urom
description: 'Host-side DOCA UROM library (doca_urom_*): offload an HPC / UCX / MPI
  application''s remote memory operations (puts, gets, atomics, collectives) from
  the host CPU onto a BlueField DPU. Trigger on "MPI all-reduce burning host CPU",
  "push UCX traffic onto the BlueField", "first doca_urom call returns NOT_PERMITTED",
  or "host library and DPU service look out of sync", even without naming DOCA UROM.
  An offload needs both halves: this host library and the UROM Service on the DPU
  (doca-urom-svc), which owns deploying that container. Covers creating UROM Service
  contexts (doca_urom_service_*) and Worker contexts (doca_urom_worker_*) that run
  plugins on the DPU, discovering plugins via doca_urom_service_get_plugins_list,
  progressing completions, and DOCA_ERROR_* from doca_urom_* calls. Route elsewhere
  for UROM Service deployment on the DPU side, MPI / UCX collective algorithm design,
  and RDMA / RoCE / IB substrate bring-up.'
