description: 'Run the disk-backed DEFT AOI improvement loop for NVIDIA Cosmos Reason
  3 / Cosmos3 models, using Nano by default and Edge or Super when explicitly requested:
  evaluate the base model on Proxy and frozen Benchmark splits, mine real image pairs
  from Proxy gaps, generate AnomalyGen synthetic NG pairs, assemble a per-iteration
  Train JSON from both producers, train with Cosmos Framework LoRA SFT, and repeat
  through the selected platform''s submit/status/logs/cancel contract. This migration
  supports bare labels only: the assistant response must be exactly OK or NG. Use
  for "run Cosmos3 DEFT AOI", "CR3 AOI loop", or "improve Cosmos3 PCB inspection with
  bare OK/NG"; do not use for rich/reasoning annotation, one-off Cosmos training,
  or generic anomaly generation.'
