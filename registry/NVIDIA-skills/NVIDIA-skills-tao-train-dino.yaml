description: DINO (DETR with Improved DeNoising Anchor Boxes) for 2D object detection.
  Transformer-based detector with denoising training, multi-scale features, and optional
  distillation support. Use when training, evaluating, exporting, distilling, quantizing,
  or running inference for a TAO DINO detector. Trigger phrases include "train DINO",
  "DETR object detection", "TAO 2D detection", "DINO with distillation".
