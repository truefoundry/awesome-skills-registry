id: NVIDIA-skills-doca-dma
display_name: doca-dma
description: "Use this skill when the user is doing hands-on DOCA DMA programming\
  \ \u2014 bringing up a doca_dma context, configuring the single doca_dma_task_memcpy\
  \ task type, sizing buffers via the doca_dma_cap_task_memcpy_* queries, setting\
  \ LOCAL_READ_ONLY / LOCAL_READ_WRITE permissions on source / destination doca_mmap\
  \ regions (plus doca_mmap_export_* for cross-peer copies), driving the progress\
  \ engine, or debugging DOCA_ERROR_* returns. Trigger even when the user does not\
  \ explicitly mention \"DOCA DMA\" or \"doca_mmap\" \u2014 typical implicit phrasings\
  \ include \"memcpy host buffer to BlueField without using the CPU\", \"offload a\
  \ bulk copy to the DPU\", \"copy returns NOT_PERMITTED on first submit\", \"buffer\
  \ too big for one DMA task\", \"task submitted but no completion\", or \"scatter-gather\
  \ copy between two memory regions\". Refuse and route elsewhere for cross-network\
  \ copies (DOCA RDMA), producer/consumer messaging (DOCA Comch), DOCA Core / progress-engine\
  \ internals, or DOCA install \u2014 those belong to other skills."
