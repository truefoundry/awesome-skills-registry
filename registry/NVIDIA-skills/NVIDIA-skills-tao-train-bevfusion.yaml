description: BEVFusion for multi-sensor 3D object detection. Fuses LiDAR point clouds
  and camera images in bird's-eye-view (BEV) space, used in autonomous driving for
  robust 3D perception. Use when training, evaluating, or running inference for a
  TAO BEVFusion model. Trigger phrases include "train BEVFusion", "LiDAR + camera
  fusion", "BEV 3D detection", "multi-sensor 3D perception".
