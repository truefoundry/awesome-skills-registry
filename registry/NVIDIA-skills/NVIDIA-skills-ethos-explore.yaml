id: NVIDIA-skills-ethos-explore
display_name: ethos-explore
description: "Captures what an AI agent is supposed to do \u2014 its purpose, boundaries,\
  \ and success criteria \u2014 as a durable snapshot for anyone building, evaluating,\
  \ reviewing, or changing it. Explores the user's codebase and docs first, then asks\
  \ one intent question at a time for what source cannot supply. Hands its answers\
  \ to ethos-write, which writes ethos.md. Use over generic brainstorming when the\
  \ goal is an agent's ethos.md."
