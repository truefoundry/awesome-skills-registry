id: NVIDIA-skills-bionemo-proteinmpnn-nim
display_name: proteinmpnn-nim
description: Run ProteinMPNN inverse folding via NVIDIA NIM to design protein sequences
  for a target backbone. Sends user-provided PDB files and design parameters to NVIDIA's
  hosted API, authenticated with an environment API key, or to a user-selected local
  NIM. Use for sequence design, backbone redesign, fixed chains and residues, omit_AAs,
  sampling temperature, soluble model, local Docker, and multi-FASTA output.
