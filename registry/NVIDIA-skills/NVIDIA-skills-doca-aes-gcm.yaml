id: NVIDIA-skills-doca-aes-gcm
display_name: doca-aes-gcm
description: "Use this skill when the user is doing hands-on DOCA AES-GCM work on\
  \ a BlueField DPU or ConnectX NIC \u2014 configuring `doca_aes_gcm_task_encrypt`\
  \ / `_task_decrypt`, querying `doca_aes_gcm_cap_*` for per-key-type (only `DOCA_AES_GCM_KEY_128`\
  \ / `_256` \u2014 AES-192 not supported) and per-task support, sizing plaintext\
  \ against the max-buf cap, setting source / destination mmap permissions, validating\
  \ with a NIST GCMVS or RFC 5288 vector, or debugging DOCA_ERROR_* including the\
  \ security-critical tag-verification-failed outcome on decrypt. Trigger even when\
  \ the user does not explicitly mention \"DOCA AES-GCM\" or \"AEAD\" \u2014 typical\
  \ implicit phrasings: \"decrypt completion IO_FAILED\", \"auth tag isn't verifying\"\
  , \"NOT_PERMITTED on my encrypt buffer\", \"is AES-192-GCM on this BlueField\" (no),\
  \ or \"encrypted record came back tampered\". Refuse and route elsewhere for non-GCM\
  \ AES modes (CBC / CTR / XTS \u2014 CPU OpenSSL), key management (KMS / HSM / rotation),\
  \ SHA (doca-sha), or general AEAD background."
