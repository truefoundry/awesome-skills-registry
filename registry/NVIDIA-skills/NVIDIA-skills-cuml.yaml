id: NVIDIA-skills-cuml
display_name: cuml
description: Use when writing, running, debugging or upgrading Python code that uses
  NVIDIA cuML (GPU machine learning), cuml.accel (zero-code-change GPU acceleration
  of scikit-learn, umap-learn and hdbscan), or GPU UMAP/HDBSCAN/RandomForest/KMeans/SVC,
  including through libraries that wrap cuML (BERTopic, rapids-singlecell). Covers
  APIs removed or renamed in 2025-2026 releases, verifying code really ran on the
  GPU, large-data UMAP/HDBSCAN memory recipes, and exporting trained models. Not for
  cuDF-only dataframe work, PyTorch or XGBoost.
