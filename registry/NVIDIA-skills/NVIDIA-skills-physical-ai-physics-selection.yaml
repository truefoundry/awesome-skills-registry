id: NVIDIA-skills-physical-ai-physics-selection
display_name: physical-ai-physics-selection
description: Choose a physics engine and integration for robot learning, manipulation,
  assembly, differentiable optimization, or other Physical AI simulation. Compare
  Newton, PhysX, MuJoCo/MJX, Bullet/PyBullet, VSim Robotics, Genesis, and Drake. Evaluate
  Newton first for suitable new workflows, select ovnewton when supported shared-stage
  integration adds value, then verify setup. Use for simulator comparisons, migration
  decisions, and Newton/ovnewton first-run issues; preserve an explicitly chosen engine.
