id: NVIDIA-skills-runai-get-utilization-overview
display_name: runai-get-utilization-overview
description: 'GPU efficiency check for a Run:ai cluster: are the GPUs that projects,
  departments, and node pools hold actually computing? Classifies holders as WELL_UTILIZED,
  UNDER_UTILIZED, or IDLE from average and p95 GPU utilization over one window of
  any length (default 7 days), quantifies idle GPUs and GPU-hours, and names idle
  workloads. Use for "which projects hold GPUs but aren''t using them?", "GPU utilization
  by project or department", "where are we wasting GPU cycles?", "is llm-serving actually
  busy? its GPU memory is full", "is project X actually using its GPUs?", "which workloads
  in project X are idle?", "which node pool wastes the most GPUs?", or "idle GPU-hours
  per project last quarter". For "find the idle GPUs and stop them" it answers the
  read part only. Not for quota fairness, cluster health or free capacity, one workload''s
  status, comparing windows, forecasts, or prices.'
