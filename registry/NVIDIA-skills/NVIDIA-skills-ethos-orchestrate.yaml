description: 'Entry point for an AI agent''s ETHOS.md: a durable snapshot of what
  the agent is for, what it must not do, and what success looks like. Routes a request
  to explore and capture intent (ethos-explore), or write or edit the file (ethos-write).
  Owns the standard every ethos sub-flow follows. Use when the user asks "help me
  write an ETHOS.md", "does my agent have an ETHOS.md?", "update my agent''s ETHOS.md",
  or when you need to pick between the ethos sub-flows.'
