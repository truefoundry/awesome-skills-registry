  and neighbor matching. Ships domain event catalogs, including workplace employee
  conduct monitoring, which requires legal review before use. Use when a request names
  Cosmos Curator, Cosmos Dataset Search, CDF, or their Make and CLI surfaces. Not
  for model training, orchestration, or unrelated dataset questions.
