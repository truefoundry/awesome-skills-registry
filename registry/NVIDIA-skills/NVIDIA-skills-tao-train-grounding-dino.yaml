display_name: tao-train-grounding-dino
description: "Grounding DINO for open-set object detection. Combines DINO-style detection\
  \ with a BERT text encoder for language-guided detection \u2014 detects objects\
  \ described by text prompts without a fixed class vocabulary. Use when training,\
  \ evaluating, exporting, quantizing, or running inference for a TAO Grounding DINO\
  \ model. Trigger phrases include \"train Grounding DINO\", \"open-vocabulary detection\"\
  , \"text-prompted detector\", \"language-guided object detection\"."
