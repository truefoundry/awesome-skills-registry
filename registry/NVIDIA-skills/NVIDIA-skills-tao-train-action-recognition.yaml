display_name: tao-train-action-recognition
description: Action recognition from video sequences. Supports RGB, optical flow,
  and joint (multi-stream) input types for classifying temporal actions in video clips.
  Use when training, evaluating, exporting, or running inference on a TAO action-recognition
  model. Trigger phrases include "train action recognition", "video action classification",
  "RGB + optical flow action model", "TAO ActionRecognition".
