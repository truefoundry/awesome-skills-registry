id: NVIDIA-skills-doca-bench
display_name: doca-bench
description: Run `doca_bench` (DOCA 2.7.0 or newer) to measure throughput, bulk latency,
  precision latency, or maximum bandwidth for RDMA, Compress, AES-GCM, SHA, DMA, EC,
  Ethernet, Comch, or GPUNetIO on a host or BlueField Arm. Use it to discover enabled
  benchmark libraries, capture a reproducible command/version/device/environment baseline,
  compare stable runs against a declared tolerance, or diagnose configuration, device-binding,
  workload-precondition, and measurement failures. Trigger for requests such as measuring
  BlueField compression speed, NIC RDMA throughput, crypto latency, or a pre-upgrade
  baseline. Do not use for application end-to-end timing, custom benchmark code, DOCA
  installation, or binary patches.
