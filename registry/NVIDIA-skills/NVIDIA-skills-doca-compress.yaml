id: NVIDIA-skills-doca-compress
display_name: doca-compress
description: 'Hardware compression offload with DOCA Compress on a BlueField DPU,
  ConnectX NIC, or host: DEFLATE compress and decompress, plus LZ4 decompress (stream
  and block; LZ4 encode is NOT supported), instead of CPU zlib / zstd. Trigger on
  "offload this gzip", "decompress incoming network data on the NIC", "compress task
  returns INVALID_VALUE on alloc_init", "submitted a task but no completion arrives",
  or "decompress LZ4 on the BlueField", even without naming DOCA Compress. Covers
  enabling compress-deflate, decompress-deflate, decompress-lz4-stream and decompress-lz4-block
  tasks on a doca_compress context, sizing source / destination doca_buf against the
  per-task cap query, mmap permissions, offload vs CPU decisions, a round-trip smoke,
  and DOCA_ERROR_* from Compress calls. Refuse and route elsewhere for zstd / Snappy
  / brotli, LZ4 encode (a CPU LZ4 library), pure mmap-to-mmap copies (doca-dma), or
  DOCA Core lifecycle internals.'
