id: NVIDIA-skills-tao-train-metric-learning-recognition
display_name: tao-train-metric-learning-recognition
description: Metric-learning recognition (ml-recog) for fine-grained visual recognition.
  Learns embeddings for retrieval-based matching (e.g., retail product recognition)
  using triplet / contrastive losses. Use when training, evaluating, exporting, or
  running inference for a TAO metric-learning recognition model. Trigger phrases include
  "train metric learning", "ml-recog", "retrieval embeddings", "triplet loss recognition",
  "fine-grained matching".
