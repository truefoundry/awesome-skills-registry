id: tech-leads-club-agent-skills-tlc-implement
display_name: tlc-implement
description: Implements work already planned - a plan.md from tlc-plan, or a small
  ticket - by freezing it into checks with proofs, building, and proving every check
  with a script and an independent Verifier before declaring done. Use when the user
  says "implement this plan", "build this ticket", "implement this spec", "write the
  checks", "verify work", or "tlc-implement". Do NOT use when nobody has decided what
  to build, or to plan a feature that needs one (that is tlc-plan).
