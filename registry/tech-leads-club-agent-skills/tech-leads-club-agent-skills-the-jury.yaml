id: tech-leads-club-agent-skills-the-jury
display_name: the-jury
description: Use when a question, decision, plan, tradeoff, or claim needs a rigorous
  verdict and one perspective is not enough. Spawns a panel of 3 to 5 subagent jurors
  that form independent blind opinions, deliberate anonymously under an anti-anchoring
  and anti-sycophancy protocol, and return one committed verdict with confidence,
  preserved dissent, and a concrete next action. Domain-agnostic across engineering,
  architecture, data, product, hiring, strategy, vendor choice, build-vs-buy, and
  research design. Trigger phrases include "convene a jury", "have agents debate and
  decide", "get a panel to decide", "multi-agent decision", "stress-test this and
  decide", "monte um juri", "tribunal de agentes", "painel para decidir". Do NOT use
  to only critique without deciding (use the-fool for that), to build a plan or write
  the solution itself, or for simple factual lookups.
