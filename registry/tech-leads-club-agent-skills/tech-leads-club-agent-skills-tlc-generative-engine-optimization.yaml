display_name: tlc-generative-engine-optimization
description: "Generative Engine Optimization (GEO) specialist \u2014 the technical,\
  \ on-page publishing work that makes a given page or site discoverable, understandable,\
  \ trustworthy, quotable, and fresh for AI answer engines (Google AI Overviews, ChatGPT\
  \ Search, Bing Copilot, Perplexity). Use when asked to 'optimize this page/site\
  \ for GEO', 'optimize for AI search / answer engines', 'get my page cited by ChatGPT/Perplexity',\
  \ 'improve AI visibility/citability', 'write an llms.txt', 'add citation-ready structure\
  \ or schema for AI answers', 'otimizar para busca com IA', or to audit/create/improve\
  \ a codebase for generative search. Do NOT use for AI-driven SEO content strategy\
  \ or programmatic pages at scale (use ai-seo), classic keyword/SERP ranking (use\
  \ seo), accessibility (use web-accessibility), or multi-area site audits (use web-quality-audit)."
