id: tech-leads-club-agent-skills-evolutionary-modular-architecture
display_name: evolutionary-modular-architecture
description: Guides design and implementation of evolutionary modular-monolith platforms
  with DDD (strategic + tactical), flat-by-aggregate organization, an Anti-Corruption
  Layer for vendor independence, a transactional outbox for events, smart resilience
  (backoff with jitter, circuit breakers, idempotency), and a polished architecture
  HTML document with elegant SVG diagrams. Use when designing a platform or backend,
  defining bounded contexts, organizing modules and folders, choosing monolith vs
  microservices, decoupling from an external service (ERP, storage, AI), making calls
  resilient, adding real-time push, picking a 2026 TypeScript stack (Nx, NestJS, React),
  or producing an architecture document or diagram. Also triggers on 'modular monolith',
  'bounded contexts', 'flat-by-aggregate', 'ports and adapters', 'architecture diagram'.
  Do NOT use for simple CRUD, NestJS-only deep implementation (use nestjs-modular-monolith),
  or pure domain-model review (use tactical-ddd).
