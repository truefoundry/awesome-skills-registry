id: bitwize-music-studio-claude-ai-music-skills-generate
display_name: generate
description: Generates a track on Suno through Suno's official MCP server - a song,
  a cover of another Suno song, a track sung in a saved Voice, a spoken-word piece,
  or a sketch that plays a MIDI score. Runs the pre-generation gates, shows the cost,
  waits for a go-ahead, makes two takes, logs them and hands off to listening. Use
  when the user says "generate track N", "regenerate", or is ready to make audio.
  Falls back to the clipboard flow when the Suno server is not connected.
