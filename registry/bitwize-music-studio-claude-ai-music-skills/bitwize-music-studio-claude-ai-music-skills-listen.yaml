description: Opens a track's Suno takes in the browser or in iTerm2 panes beside the
  session, or plays takes and local audio in the terminal. Use when the user wants
  to hear a take, compare takes, audition a generation, or says "play it" or "let
  me hear it". Opening the song page is the default and is free; playing a new Suno
  take in the terminal uses one download credit.
