display_name: apple-container
description: "Apple's open-source `container` CLI to build, run, and manage OCI/Linux\
  \ containers as lightweight per-container VMs on Apple-silicon macOS \u2014 no Docker\
  \ daemon required. Use when the user mentions the `container` CLI, \"apple container\"\
  , running or building containers on macOS without Docker/Podman, `container run`,\
  \ `container build`, `container images`, `container system start`, pushing/pulling\
  \ images to a registry, or container networking on macOS. This is Apple's `container`\
  \ tool specifically (repo `apple/container`), NOT Docker, Podman, containerd, nerdctl,\
  \ or Kubernetes \u2014 the CLI is Docker-like but is a different tool."
