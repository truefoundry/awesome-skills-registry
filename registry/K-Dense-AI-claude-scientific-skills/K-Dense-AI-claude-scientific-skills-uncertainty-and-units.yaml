id: K-Dense-AI-claude-scientific-skills-uncertainty-and-units
display_name: uncertainty-and-units
description: Tracks physical units and propagates measurement uncertainty in scientific
  calculations using pint and uncertainties. Use for unit conversion and dimensional
  checking, GUM uncertainty budgets, Type A and Type B evaluation, coverage factors
  and expanded uncertainty, Monte Carlo propagation, significant-figure and plus-minus
  reporting, error propagation through curve fits, CODATA constants, auditing Python
  code for stripped units or broken uncertainty propagation, and order-of-magnitude
  plausibility checks using dimensionless groups (Reynolds, Peclet, Damkohler, Knudsen,
  Biot, Womersley), characteristic scales such as diffusion time or Debye length,
  and observed magnitude ranges. Trigger on "is this number physically reasonable",
  "sanity check these units", "what regime is this flow in", or a result that looks
  off by orders of magnitude.
