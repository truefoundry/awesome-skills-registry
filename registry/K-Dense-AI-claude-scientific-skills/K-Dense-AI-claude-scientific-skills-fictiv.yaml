id: K-Dense-AI-claude-scientific-skills-fictiv
display_name: fictiv
description: Operates Fictiv (app.fictiv.com), the on-demand manufacturing platform,
  end to end in the user's browser. Covers uploading CAD parts, configuring process,
  material, finish, threads, tolerances and inspections, getting instant or manual
  quotes, reading and fixing DFM feedback, choosing lead time and region, checking
  out and paying (card or PO), tracking orders, reordering, and troubleshooting. Applies
  when the user mentions Fictiv, wants a part CNC machined, 3D printed, sheet-metal
  fabricated, urethane cast, injection or compression molded, or die cast through
  an online service, asks to "get a quote" or "order parts" for a STEP/SLDPRT/STL
  file, wants to check a Fictiv quote or order status, or has a problem with a Fictiv
  upload, DFM warning, price or checkout. Also applies when the user wants custom
  parts manufactured and has a Fictiv account, even if Fictiv is not named.
