description: Analyzes flow cytometry data with FlowKit, including spillover compensation,
  logicle and biexponential transforms, hierarchical gating, GatingML strategies,
  and supported FlowJo 10 workspaces. Use for reproducible gate counts, population
  percentages, gated fluorescence summaries, or reproducing a FlowJo analysis in Python.
  For FCS metadata inspection or file-format repair alone, use FlowIO.
