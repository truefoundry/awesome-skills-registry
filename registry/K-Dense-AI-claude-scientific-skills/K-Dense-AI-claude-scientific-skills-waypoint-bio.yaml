id: K-Dense-AI-claude-scientific-skills-waypoint-bio
display_name: waypoint-bio
description: Supports work with Outpost Bio's open microbiome foundation models -
  the Waypoint checkpoints (Waypoint-6m, Waypoint-45m, Waypoint-170m), the Atlas pretraining
  corpus, the Compass eight-task benchmark, or the `waypoint` CLI from the `waypoint-bio`
  package. Covers embedding microbiome samples, fine-tuning on taxonomic abundance
  data, benchmarking a checkpoint on Compass, pretraining a GPT-2 model on taxonomic
  abundance profiles, and converting MetaPhlAn, Kraken2, QIIME 2, or MGnify abundance
  tables into waypoint format.
