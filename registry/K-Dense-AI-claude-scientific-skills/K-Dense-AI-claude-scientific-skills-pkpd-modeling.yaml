display_name: pkpd-modeling
description: Pharmacokinetic and pharmacodynamic modelling and simulation - non-compartmental
  analysis, compartmental and population PK, PK/PD and exposure-response, TMDD, PBPK
  orientation, bioequivalence, allometric scaling and first-in-human dose, drug interaction
  prediction, and Bayesian therapeutic drug monitoring. Use when analysing concentration-time
  data, deriving exposure metrics, fitting PK or PD models, or evaluating dosing regimens.
