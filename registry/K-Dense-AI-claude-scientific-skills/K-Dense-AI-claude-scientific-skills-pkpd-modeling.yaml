  "Emax", "EC50", "indirect response", "effect compartment", "TMDD", "PBPK", "bioequivalence",
  "RSABE", "ABEL", "allometric scaling", "first-in-human", "MABEL", "drug-drug interaction",
  "DDI", "ICH M12", "concentration-QTc", "therapeutic drug monitoring", "MIPD", and
  "dosing regimen".
