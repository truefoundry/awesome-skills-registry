display_name: create-prd
description: 'Create a lean, decision-ready Product Requirements Document with an
  8-section template: summary, contacts, background, objective, market segments, value
  propositions (6-part JTBD template), solution, and release. Lean by default (about
  one to two pages), with a fuller spec on request. Use when writing a PRD, documenting
  product requirements, preparing a feature spec, or reviewing an existing PRD.'
