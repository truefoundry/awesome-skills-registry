id: phuryn-pm-skills-pre-mortem
display_name: pre-mortem
description: Run a pre-mortem risk analysis on a PRD or launch plan. Categorizes risks
  as Tigers (real problems), Paper Tigers (overblown concerns), and Elephants (unspoken
  worries), then classifies as launch-blocking, fast-follow, or track. Use when preparing
  for launch, stress-testing a product plan, or identifying what could go wrong.
