id: metalbear-co-skills-mirrord-temporal
display_name: mirrord-temporal
description: Helps DevOps engineers configure mirrord Operator's Temporal task queue
  splitting feature end-to-end. Generates the MirrordSplitConfig and MirrordPropertyList
  Kubernetes CRD YAMLs, the matching mirrord.json split_queues section with message_filter
  and jq_filter, and Helm value guidance. Use this skill whenever the user mentions
  Temporal splitting with mirrord, Temporal task queue splitting, splitting a Temporal
  worker, configuring mirrord with Temporal or Temporal Cloud, routing Temporal workflow
  or activity tasks to a local worker, or troubleshooting Temporal splitting sessions.
  Also trigger on split_queues with queue_type Temporal, or connecting mirrord to
  a Temporal frontend. This is an alpha Team/Enterprise feature of mirrord.
