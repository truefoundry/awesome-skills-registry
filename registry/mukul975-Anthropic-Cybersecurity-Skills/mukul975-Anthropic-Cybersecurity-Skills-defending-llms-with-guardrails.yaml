id: mukul975-Anthropic-Cybersecurity-Skills-defending-llms-with-guardrails
display_name: defending-llms-with-guardrails
description: Deploys Llama Guard 3 safety classification, NeMo Guardrails programmable
  dialogue rails, and LLM Guard input/output scanner pipelines as complementary runtime
  defenses that inspect and constrain LLM prompts and responses. Use when adding a
  production runtime safety layer to an LLM, RAG, or agent application to block jailbreaks,
  prompt injection (OWASP LLM01), toxic content, or sensitive-data leakage before
  it reaches or leaves the model.
