display_name: building-cloud-siem-with-sentinel
description: Deploy Microsoft Sentinel as a cloud-native SIEM/SOAR by configuring
  multi-cloud data connectors (AWS, Azure, GCP), writing KQL detection and hunting
  queries, and building automated Logic Apps response playbooks. Use when establishing
  a centralized SOC for multi-cloud environments, migrating from a legacy SIEM, or
  performing petabyte-scale threat hunting; not for AWS-only setups where Security
  Hub/GuardDuty suffice or for endpoint EDR needs.
