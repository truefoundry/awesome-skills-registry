description: Detect AI-generated deepfake audio used in voice phishing (vishing) by
  extracting spectral features (MFCC, spectral centroid, spectral contrast, zero-crossing
  rate) and classifying samples with machine learning models, supporting batch audio
  analysis, confidence scoring, and forensic reporting. Use for deepfake voice detection,
  vishing investigations, AI-generated speech analysis, voice cloning detection, or
  audio authenticity verification.
