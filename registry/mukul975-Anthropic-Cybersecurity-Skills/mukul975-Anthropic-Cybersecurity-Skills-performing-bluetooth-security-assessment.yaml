id: mukul975-Anthropic-Cybersecurity-Skills-performing-bluetooth-security-assessment
display_name: performing-bluetooth-security-assessment
description: Assess Bluetooth Low Energy (BLE) device security using Python's bleak
  asyncio library to discover nearby devices, enumerate GATT services and characteristics,
  and flag unencrypted or unauthenticated read/write access to sensitive data. Use
  when auditing IoT, healthcare, fitness, or smart-home BLE devices for weak pairing
  configurations or known vulnerable device fingerprints.
