id: mukul975-Anthropic-Cybersecurity-Skills-implementing-runtime-security-with-tetragon
display_name: implementing-runtime-security-with-tetragon
description: 'Implements eBPF-based runtime observability and in-kernel enforcement
  in Kubernetes with Cilium Tetragon, monitoring process execution, file access, network
  connections, and syscalls, and blocking dangerous calls at the kernel level. Use
  when deploying Tetragon to detect or block syscalls such as ptrace, mount, and unshare,
  enforcing kernel-level policy, or adding low-overhead runtime detection to a cluster.
  Keywords: Tetragon, Cilium, eBPF, TracingPolicy, kprobe, enforcement, process lineage.
  Do not use for Falco-based detection - use detecting-container-runtime-threats-with-falco.'
