id: mukul975-Anthropic-Cybersecurity-Skills-performing-kubernetes-etcd-security-assessment
display_name: performing-kubernetes-etcd-security-assessment
description: 'Assesses the security posture of the etcd cluster backing Kubernetes:
  encryption at rest, TLS peer and client transport, access control, backup encryption,
  and network isolation. Use when auditing or hardening a control plane, reviewing
  whether Secrets are encrypted at rest, or protecting etcd backups, since etcd stores
  Secrets, RBAC policy, and ConfigMaps in plaintext by default. Keywords: etcd, EncryptionConfiguration,
  encryption at rest, peer TLS, snapshot, backup, control plane. Do not use for broad
  cluster-wide CIS checks - use performing-kubernetes-cis-benchmark-with-kube-bench.'
