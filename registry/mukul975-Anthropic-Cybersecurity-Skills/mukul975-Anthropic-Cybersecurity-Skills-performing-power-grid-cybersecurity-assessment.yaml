description: Conduct cybersecurity assessments of power grid infrastructure spanning
  generation, transmission substations, distribution, and EMS control centers, covering
  NERC CIP compliance verification, IEC 61850 (GOOSE/MMS) substation protocol analysis,
  and synchrophasor (PMU) network security against threats like Industroyer/CrashOverride.
  Use for periodic NERC CIP assessments, substation automation or EMS/SCADA security
  reviews, or regional entity compliance audits; not for non-BES systems or generic
  OT assessments without power grid specifics.
