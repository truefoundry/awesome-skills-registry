description: Investigate AWS security incidents using Amazon Detective's behavior
  graphs, built from CloudTrail, VPC Flow Logs, GuardDuty, and EKS audit logs, to
  trace entity timelines and profile IAM users, roles, EC2 instances, and IP addresses
  for lateral movement. Use when triaging GuardDuty findings, investigating a suspected
  AWS compromise, or reconstructing an attacker's activity timeline across AWS accounts.
