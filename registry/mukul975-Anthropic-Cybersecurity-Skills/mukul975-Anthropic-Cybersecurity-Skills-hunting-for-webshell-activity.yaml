display_name: hunting-for-webshell-activity
description: Runs a hypothesis-driven threat hunt for web shell deployment (T1505.003)
  on internet-facing servers by analyzing file creation in web directories, suspicious
  child-process spawning from web server processes, and anomalous HTTP request patterns.
  Use when hunting for web shells after a public-facing app compromise, when EDR/SIEM
  alerts fire on webserver process anomalies, or during incident response on internet-facing
  infrastructure.
