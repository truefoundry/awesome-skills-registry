display_name: analyzing-linux-system-artifacts
description: Examine Linux system artifacts (auth logs, cron/systemd persistence,
  shell history, SSH keys, and system configuration) to uncover evidence of compromise,
  detect rootkits or backdoors, and reconstruct user/attacker activity. Use when investigating
  a compromised Linux server or workstation, hunting for persistence mechanisms, or
  scoping a Linux-based breach during incident response.
