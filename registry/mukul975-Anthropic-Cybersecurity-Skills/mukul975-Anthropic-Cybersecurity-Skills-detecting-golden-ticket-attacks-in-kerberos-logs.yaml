id: mukul975-Anthropic-Cybersecurity-Skills-detecting-golden-ticket-attacks-in-kerberos-logs
display_name: detecting-golden-ticket-attacks-in-kerberos-logs
description: Detect Golden Ticket attacks in Active Directory using Splunk and KQL
  queries against domain controller event logs, looking for Kerberos TGT anomalies
  such as mismatched encryption types, impossible ticket lifetimes, non-existent accounts,
  and forged PAC signatures. Use when hunting for Kerberos ticket forgery or krbtgt-based
  persistence (MITRE T1558.001) in AD environments.
