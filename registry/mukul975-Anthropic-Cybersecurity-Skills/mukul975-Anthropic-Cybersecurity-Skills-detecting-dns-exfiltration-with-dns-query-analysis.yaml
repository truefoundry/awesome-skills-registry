display_name: detecting-dns-exfiltration-with-dns-query-analysis
description: Detect data exfiltration via DNS tunneling (tools like iodine, dnscat2,
  dns2tcp) by analyzing query entropy, subdomain length, query volume to single domains,
  TXT/CNAME/NULL record abuse, and oversized response payloads using passive DNS monitoring
  and statistical/ML methods. Use when hunting for covert DNS-based data exfiltration
  or building a passive DNS anomaly detection capability.
