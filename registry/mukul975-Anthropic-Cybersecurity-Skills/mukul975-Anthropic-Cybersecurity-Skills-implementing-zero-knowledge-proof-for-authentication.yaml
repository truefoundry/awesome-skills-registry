id: mukul975-Anthropic-Cybersecurity-Skills-implementing-zero-knowledge-proof-for-authentication
display_name: implementing-zero-knowledge-proof-for-authentication
description: Implements the Schnorr identification protocol and a simplified Zero-Knowledge
  Password Proof (ZKPP) over the discrete logarithm problem, letting a prover authenticate
  by demonstrating knowledge of a secret without ever revealing it to the server.
  Use when designing or building password-less or password-secret-free authentication,
  or when a server must verify a user's credential without learning or storing the
  underlying secret.
