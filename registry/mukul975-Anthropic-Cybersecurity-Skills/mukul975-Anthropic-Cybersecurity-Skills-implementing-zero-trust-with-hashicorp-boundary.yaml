description: Installs and configures HashiCorp Boundary as a default-deny, identity-aware
  proxy for infrastructure access, including controller/worker setup, Vault-backed
  credential brokering, session recording, and OIDC/LDAP auth across an org/project
  scope hierarchy. Use when replacing VPN or direct network access with just-in-time,
  credential-less Boundary sessions, or standing up Boundary controllers and workers.
