id: mukul975-Anthropic-Cybersecurity-Skills-detecting-data-and-model-poisoning
display_name: detecting-data-and-model-poisoning
description: Identify poisoned training data and backdoored ML models across the pipeline
  using IBM's Adversarial Robustness Toolbox (activation clustering, spectral signatures,
  trigger reconstruction), Cleanlab for label-quality issues, and supply-chain checks
  like weight-hash verification and safetensors enforcement. Use before training or
  deploying on third-party/user-contributed data or downloaded checkpoints, during
  ML supply-chain reviews, or when investigating model misbehavior tied to specific
  inputs (suspected backdoor trigger).
