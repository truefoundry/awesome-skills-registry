display_name: building-identity-governance-lifecycle-process
description: Design identity governance and lifecycle (IGA) programs on platforms
  like SailPoint, Saviynt, or Entra ID Governance, covering joiner-mover-leaver (JML)
  automation, role mining, access requests, periodic recertification, and orphaned-account
  remediation sourced from an HR feed. Use when automating cross-system JML provisioning,
  remediating former-employee access, or building lifecycle processes for SOX, HIPAA,
  or GDPR compliance.
