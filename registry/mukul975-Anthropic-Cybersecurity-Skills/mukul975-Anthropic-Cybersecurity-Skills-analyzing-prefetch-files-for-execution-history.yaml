id: mukul975-Anthropic-Cybersecurity-Skills-analyzing-prefetch-files-for-execution-history
display_name: analyzing-prefetch-files-for-execution-history
description: Parse Windows Prefetch files (versions 17, 23, 26, 30) with tools like
  PECmd, WinPrefetchView, or python-prefetch to determine program execution history,
  including run counts, execution timestamps, and referenced files/DLLs. Use when
  building a timeline of program execution on a Windows system, confirming whether
  a suspicious binary ran, or correlating execution evidence with other forensic artifacts
  during an investigation.
