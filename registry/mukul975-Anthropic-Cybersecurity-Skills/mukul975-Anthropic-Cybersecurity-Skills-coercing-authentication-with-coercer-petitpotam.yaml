description: Trigger machine account authentication with PetitPotam (MS-EFSR) and
  Coercer (MS-RPRN, MS-DFSNM, MS-FSRVP, MS-EVEN) via Coercer's scan/coerce/fuzz modes,
  feeding the coerced NTLM auth into a relay against AD CS Web Enrollment (ESC8),
  LDAP (RBCD), or SMB. Use in authorized engagements to complete a coercion-relay
  chain against a Domain Controller, or to validate coercion detections and signing/EPA
  mitigations.
