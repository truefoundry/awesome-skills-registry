id: mukul975-Anthropic-Cybersecurity-Skills-implementing-kubernetes-pod-security-standards
display_name: implementing-kubernetes-pod-security-standards
description: 'Chooses and applies the correct Kubernetes Pod Security Standard (Privileged,
  Baseline, Restricted) for a workload: what each profile forbids, how to map existing
  workloads to a profile, which securityContext fields must change, and how to plan
  a PodSecurityPolicy-to-PSS migration without breaking running pods. Use when deciding
  which pod security profile a namespace or workload should run under, auditing which
  workloads would fail Restricted, planning a PSP migration, or mapping pod security
  posture to a compliance control. Keywords: Pod Security Standards, PSS, Privileged,
  Baseline, Restricted, securityContext, runAsNonRoot, drop ALL capabilities, seccomp
  RuntimeDefault, PSP migration. Do not use for configuring the admission controller
  that enforces these profiles - use implementing-pod-security-admission-controller.'
