display_name: analyzing-cobaltstrike-malleable-c2-profiles
description: Parse and analyze Cobalt Strike Malleable C2 profiles with dissect.cobaltstrike
  (profiles and beacon-payload configs) and pyMalleableC2 (AST parsing) to extract
  HTTP/DNS transforms, URIs, headers, sleep/jitter, and injection behavior, then generate
  network detection signatures. Use when reverse-engineering a captured malleable
  profile or building detections against Cobalt Strike Beacon traffic.
