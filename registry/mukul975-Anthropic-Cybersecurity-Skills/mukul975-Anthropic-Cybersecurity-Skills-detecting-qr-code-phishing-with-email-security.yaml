description: Detect and prevent QR code phishing (quishing) attacks that embed malicious
  URLs inside QR code images to bypass link-based email security, using image-based
  threat detection, OCR/QR decoding, and mobile-side scanning (Microsoft Defender
  for O365, Proofpoint TAP, Barracuda Multimodal AI). Use when configuring gateway
  rules against QR phishing or investigating suspicious emails containing QR codes.
