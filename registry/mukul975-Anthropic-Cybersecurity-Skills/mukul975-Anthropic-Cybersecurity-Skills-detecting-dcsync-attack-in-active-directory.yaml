id: mukul975-Anthropic-Cybersecurity-Skills-detecting-dcsync-attack-in-active-directory
display_name: detecting-dcsync-attack-in-active-directory
description: Detect DCSync attacks (MITRE T1003.006) where adversaries abuse Active
  Directory replication privileges to extract password hashes, by auditing Event ID
  4662 for the DS-Replication-Get-Changes GUIDs and flagging non-domain-controller
  accounts issuing DsGetNCChanges RPC calls. Use when hunting for credential theft
  via Mimikatz lsadump::dcsync or Impacket secretsdump, investigating lateral movement
  with domain admin credentials, or auditing AD replication permissions.
