id: mukul975-Anthropic-Cybersecurity-Skills-detecting-command-and-control-over-dns
display_name: detecting-command-and-control-over-dns
description: Detect command-and-control (C2) traffic tunneled over DNS from tools
  like Iodine, dnscat2, dns2tcp, and Cobalt Strike DNS beacon, using Shannon entropy
  analysis of query subdomains, ML-based DGA classification, passive DNS correlation,
  and Zeek/Suricata signatures. Use when investigating suspected DNS tunneling, classifying
  DGA domains, detecting DNS beaconing, or building DNS anomaly rules for a SOC/SIEM.
