id: mukul975-Anthropic-Cybersecurity-Skills-detecting-typosquatting-packages
display_name: detecting-typosquatting-packages
description: Flag misspelled, brandjacked, and typosquatted package names across npm,
  PyPI, and crates.io before installation, using edit-distance, keyboard-proximity,
  and known-target corpus matching with typomania, Microsoft OSSGadget's oss-find-squats,
  and pypi-scan. Use before adding a new dependency, as a CI/CD gate on pull requests,
  when reviewing an AI-generated ("slopsquatting") dependency list, or when auditing
  a lockfile diff for a swapped package.
