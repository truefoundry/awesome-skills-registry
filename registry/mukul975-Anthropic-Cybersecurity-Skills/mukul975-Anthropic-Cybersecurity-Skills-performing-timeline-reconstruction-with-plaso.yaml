display_name: performing-timeline-reconstruction-with-plaso
description: Builds comprehensive forensic super-timelines using Plaso (log2timeline
  and psort) to correlate events across file system metadata, event logs, browser
  history, and registry artifacts into a unified chronological view. Use during complex
  forensic investigations that need cross-source event correlation, or when standard
  log analysis is insufficient to establish the sequence of activities for reporting
  findings.
