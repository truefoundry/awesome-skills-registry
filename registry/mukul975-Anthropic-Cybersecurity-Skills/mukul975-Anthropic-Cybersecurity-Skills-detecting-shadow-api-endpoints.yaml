id: mukul975-Anthropic-Cybersecurity-Skills-detecting-shadow-api-endpoints
display_name: detecting-shadow-api-endpoints
description: Discover and inventory shadow API endpoints that operate outside documented
  OpenAPI/Swagger specs, using traffic analysis against API gateways (Kong, AWS API
  Gateway, Envoy), cloud configuration scanning, and source code repository mining
  for undocumented routes. Use when assessing API attack surface, auditing for forgotten
  test environments or deprecated API versions still running, or building an API registration
  governance policy.
