description: "Parse Windows forensic artifacts\u2014$MFT/$J (MFTECmd), Prefetch (PECmd),\
  \ registry hives (RECmd), shellbags, and Amcache\u2014into normalized CSV/JSON with\
  \ Eric Zimmerman's EZ Tools, then load results into Timeline Explorer for analysis.\
  \ Use during DFIR/incident-response investigations, after triage collection (e.g.\
  \ with KAPE), to establish program execution, file/folder access, and persistence\
  \ evidence from acquired forensic images."
