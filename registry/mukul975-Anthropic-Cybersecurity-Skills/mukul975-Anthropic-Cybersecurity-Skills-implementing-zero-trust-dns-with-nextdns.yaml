id: mukul975-Anthropic-Cybersecurity-Skills-implementing-zero-trust-dns-with-nextdns
display_name: implementing-zero-trust-dns-with-nextdns
description: Configure NextDNS as an encrypted (DoH/DoT) zero trust DNS resolver that
  blocks malicious, phishing, and cryptojacking domains via real-time threat intelligence,
  detects DNS rebinding and CNAME cloaking, and enforces organizational DNS policy
  across endpoints. Use when deploying DNS-layer threat blocking and acceptable-use
  enforcement, or when extending zero trust controls (including Windows 11 Zero Trust
  DNS) to the DNS resolution path.
