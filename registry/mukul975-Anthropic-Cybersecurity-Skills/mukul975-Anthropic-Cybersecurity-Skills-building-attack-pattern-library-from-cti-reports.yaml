id: mukul975-Anthropic-Cybersecurity-Skills-building-attack-pattern-library-from-cti-reports
display_name: building-attack-pattern-library-from-cti-reports
description: Parse cyber threat intelligence reports (Mandiant, CrowdStrike, Talos,
  Microsoft) with stix2, mitreattack-python, and spaCy to extract adversary behaviors,
  map them to MITRE ATT&CK technique IDs, and build a searchable STIX 2.1 attack-pattern
  library with detection templates. Use when cataloging attack patterns from CTI reports
  for threat-informed detection engineering, or generating Sigma/YARA templates from
  documented behaviors.
